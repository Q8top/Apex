<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>奥林匹斯之门 · Apex</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/src/css/game-detail.css">
</head>
<body>
<svg class="gd-svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gdg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A6"/>
      <stop offset=".45" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="gdg-gold-lt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C8"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="gdg-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A8A"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="gdg-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4A6FF"/>
      <stop offset="1" stop-color="#5B3BB5"/>
    </linearGradient>
    <linearGradient id="gdg-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="gdg-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8E6A1"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="gdg-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE580"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
  </defs>
</svg>



<main class="gd-page" data-game-id="olympus">
  <header class="gd-topbar">
    <button class="gd-icon-btn" id="gdBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18 L9 12 L15 6"/>
      </svg>
    </button>

    <h1 class="gd-title">奥林匹斯之门</h1>

    <button class="gd-icon-btn" id="gdShare" type="button" aria-label="分享">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <path d="M8.6 13.5 L15.4 17.5"/>
        <path d="M15.4 6.5 L8.6 10.5"/>
      </svg>
    </button>
  </header>

  <section class="gd-carousel" id="gdCarousel"
           aria-roledescription="carousel" aria-label="游戏画面">
    <div class="gd-track" id="gdTrack"></div>
  </section>

  <div class="gd-dots" id="gdDots" role="tablist" aria-label="选择游戏画面"></div>
  <div class="gd-content" id="gdContent">

    <section class="gd-section" id="gdSecAbout" hidden>
      <h2 class="gd-section-title">关于游戏</h2>
      <p class="gd-about" id="gdAboutText"></p>
    </section>

    <section class="gd-section" id="gdSecSymbols" hidden>
      <header class="gd-section-head">
        <h2 class="gd-section-title">游戏符号</h2>
        <span class="gd-section-note" id="gdSymbolCount"></span>
      </header>
      <div class="gd-symbol-grid" id="gdSymbolGrid"></div>
    </section>

    <section class="gd-section" id="gdSecFeatures" hidden>
      <h2 class="gd-section-title">游戏特色</h2>
      <ul class="gd-feature-list" id="gdFeatureList"></ul>
    </section>

    <section class="gd-section" id="gdSecMeta" hidden>
      <h2 class="gd-section-title">游戏信息</h2>
      <dl class="gd-meta-list" id="gdMetaList"></dl>
    </section>

  </div>

  <nav class="gd-actionbar" aria-label="游戏操作">
    <button type="button" class="gd-action gd-action-icon" id="gdFav" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20.5s-7.5-4.6-7.5-10.5a4.5 4.5 0 0 1 8-2.83A4.5 4.5 0 0 1 20 10c0 5.9-8 10.5-8 10.5z"/>
      </svg>
      <span class="gd-action-label">收藏</span>
    </button>

    <button type="button" class="gd-action gd-action-icon" id="gdService">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
        <rect x="3" y="13" width="4" height="7" rx="1.5"/>
        <rect x="17" y="13" width="4" height="7" rx="1.5"/>
      </svg>
      <span class="gd-action-label">客服</span>
    </button>

    <button type="button" class="gd-action gd-action-demo" id="gdDemo">免费试玩</button>
    <button type="button" class="gd-action gd-action-play" id="gdPlay">开始游戏</button>
  </nav>

</main>

<div class="gd-toast" id="gdToast" role="status" aria-live="polite"></div>

<script src="/src/js/game-detail.js" defer></script>
</body>
</html>
