<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>ApexTop | 登录</title>
  <style>
    :root {
      --bg: #09090b; --surface: rgba(24, 24, 27, 0.6); --border: rgba(255,255,255,0.08); 
      --text: #fafafa; --muted: #a1a1aa; --primary: #ffffff; --primary-text: #09090b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "SF Pro Display", "Inter", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%; width: 100%; background: var(--bg); color: var(--text);
      overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 60%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* 顶部 */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: max(16px, env(safe-area-inset-top)) 24px 16px; flex-shrink: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .logo svg { width: 22px; height: 22px; fill: #fff; }
    .lang-btn { display: flex; gap: 6px; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); font-size: 12px; cursor: pointer; color: #fff; backdrop-filter: blur(10px); }

    /* 主内容区 */
    .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 20px 40px; width: 100%; max-width: 400px; margin: 0 auto; z-index: 10; }
    .view { display: none; width: 100%; animation: slideUp 0.3s ease-out forwards; }
    .view.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 毛玻璃卡片 */
    .card { background: var(--surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    .header p { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); cursor: pointer; margin-bottom: 16px; transition: 0.2s; background: none; border: none; padding: 0; }
    .back-btn:hover { color: #fff; }
    .back-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* 输入框 */
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
    .input-wrap { position: relative; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 14px; transition: 0.3s; }
    .input-wrap:focus-within { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.6); }
    .input-wrap input { flex: 1; width: 100%; padding: 14px 14px 14px 44px; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap .icon { position: absolute; left: 14px; width: 20px; height: 20px; stroke: var(--muted); stroke-width: 2; fill: none; pointer-events: none; }
    .pwd-actions { position: absolute; right: 14px; cursor: pointer; display: flex; padding: 4px; }
    .pwd-actions svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; }
    .pwd-actions.active svg { stroke: #fff; }
    
    .form-tip { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .form-tip.warn { color: var(--danger); }

    /* 验证码盒子 */
    .apex-captcha-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 14px; padding: 0 16px; height: 56px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; cursor: pointer; overflow: hidden; user-select: none; }
    .apex-captcha-content { display: flex; align-items: center; gap: 12px; }
    .apex-captcha-checkbox { width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .apex-captcha-box.checked .apex-captcha-checkbox { background: #fff; border-color: #fff; }
    .apex-checkmark { width: 14px; height: 14px; stroke: #000; fill: none; stroke-width: 3; display: none; }
    .apex-captcha-box.checked .apex-checkmark { display: block; }
    .apex-captcha-text { font-size: 14px; }
    .apex-captcha-percent { font-size: 12px; color: var(--muted); margin-left: 8px; }
    .apex-captcha-footer { font-size: 11px; color: var(--muted); }

    /* 6位数字验证码 */
    .code-boxes { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 18px; }
    .code-boxes input { width: 100%; height: 50px; text-align: center; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; transition: 0.2s; }
    .code-boxes input:focus { border-color: rgba(255,255,255,0.4); }

    /* 按钮 */
    .btn-primary { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; background: #fff; color: #000; margin-top: 8px; transition: 0.2s; }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-outline { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--border); font-size: 15px; font-weight: 600; cursor: pointer; background: transparent; color: #fff; margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-outline:active { background: rgba(255,255,255,0.1); }

    .actions { display: flex; justify-content: space-between; font-size: 13px; margin: 20px 0; }
    .actions a { color: var(--muted); text-decoration: none; cursor: pointer; transition: 0.2s; }
    .actions a:hover { color: #fff; }
    
    .divider { display: flex; align-items: center; color: var(--muted); font-size: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }

    /* 底部 */
    .footer { padding: 20px; display: flex; justify-content: center; gap: 16px; font-size: 12px; flex-shrink: 0; margin-bottom: env(safe-area-inset-bottom); z-index: 10; }
    .footer a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="logo"><svg viewBox="0 0 64 64"><path d="M32 2L38.5 25.5L62 32L38.5 38.5L32 62L25.5 38.5L2 32L25.5 25.5L32 2Z"/></svg> ApexTop</div>
    <div class="lang-btn">🇨🇳 简体中文</div>
  </div>

  <div class="main-content">
    
    <!-- 登录 -->
    <div id="view-login" class="view active">
      <div class="card">
        <div class="header"><h1>欢迎回来</h1></div>
        
        <div class="input-group">
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="login-account" autocomplete="username" placeholder="账号 / 邮箱">
          </div>
        </div>
        
        <div class="input-group">
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" autocomplete="current-password" placeholder="密码">
            <div class="pwd-actions" onclick="togglePwd(this)">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
        </div>

        <div class="apex-captcha-box" id="login-captcha">
          <div class="apex-captcha-content">
            <div class="apex-captcha-checkbox"><svg class="apex-checkmark" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
            <div class="apex-captcha-text">点击进行人机验证</div>
            <div class="apex-captcha-percent">0%</div>
          </div>
          <div class="apex-captcha-footer">Apex 安全防护</div>
        </div>

        <div class="actions">
          <a onclick="switchView('view-register')">没有账号？注册</a>
          <a onclick="switchView('view-forgot')">忘记密码？</a>
        </div>

        <button class="btn-primary" onclick="doLogin()">登 录</button>

        <div class="divider">或</div>
        <button class="btn-outline" onclick="alert('即将支持 Passkey 登录')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3H5a2 2 0 0 0-2 2v2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M17 21h2a2 2 0 0 0 2-2v-2"/><path d="M9 10v1"/><path d="M15 10v1"/><path d="M9 15s1.2 1.2 3 1.2 3-1.2 3-1.2"/></svg>
          Passkey 登录
        </button>
      </div>
    </div>

    <!-- 注册 -->
    <div id="view-register" class="view">
      <div class="card">
        <button class="back-btn" onclick="switchView('view-login')">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 返回登录
        </button>
        <div class="header"><h1>创建账号</h1></div>
        
        <div class="input-group">
          <label>账号</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="reg-username" autocomplete="username" placeholder="请输入账号">
          </div>
          <div class="form-tip">6-20 位字符，支持字母、数字、下划线</div>
        </div>

        <div class="input-group">
          <label>邮箱</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="reg-email" autocomplete="email" placeholder="请输入邮箱">
          </div>
          <div class="form-tip warn">⚠️ 必须填写真实邮箱，以便找回密码</div>
        </div>

        <div class="input-group">
          <label>密码</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="reg-password" autocomplete="new-password" placeholder="请输入密码">
            <div class="pwd-actions" onclick="togglePwd(this)">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
          <div class="form-tip">至少 12 位，含大小写字母、数字和特殊字符</div>
        </div>

        <div class="input-group">
          <label>确认密码</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="请再次输入密码">
            <div class="pwd-actions" onclick="togglePwd(this)">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
        </div>

        <div class="apex-captcha-box" id="reg-captcha">
          <div class="apex-captcha-content">
            <div class="apex-captcha-checkbox"><svg class="apex-checkmark" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
            <div class="apex-captcha-text">点击进行人机验证</div>
            <div class="apex-captcha-percent">0%</div>
          </div>
          <div class="apex-captcha-footer">Apex 安全防护</div>
        </div>

        <button class="btn-primary" onclick="alert('注册功能开发中，请使用已有账号登录')">注 册</button>
      </div>
    </div>

    <!-- 找回密码 -->
    <div id="view-forgot" class="view">
      <div class="card">
        <button class="back-btn" onclick="switchView('view-login')">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> 返回登录
        </button>
        <div class="header"><h1>找回密码</h1></div>
        
        <div class="input-group">
          <label>邮箱</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="forgot-email" placeholder="请输入绑定的邮箱">
          </div>
        </div>

        <div class="input-group">
          <label>验证码</label>
          <div class="code-boxes" id="recover-code">
            <input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)"><input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)"><input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)">
            <input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)"><input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)"><input type="text" maxlength="1" inputmode="numeric" oninput="moveFocus(this)">
          </div>
        </div>

        <div class="input-group">
          <label>新密码</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="forgot-newpwd" placeholder="请输入新密码">
          </div>
        </div>

        <div class="input-group">
          <label>确认新密码</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="forgot-confirm" placeholder="请再次输入新密码">
          </div>
        </div>

        <button class="btn-primary" onclick="alert('重置密码功能开发中')">重置密码</button>
      </div>
    </div>

  </div>

  <div class="footer">
    <a href="#">用户协议</a>
    <a href="#">隐私政策</a>
    <a href="#">帮助中心</a>
  </div>

  <script>
    // 视图切换
    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    // 密码显示/隐藏
    function togglePwd(btn) {
      const input = btn.parentNode.querySelector('input');
      if (input.type === 'password') { input.type = 'text'; btn.classList.add('active'); } 
      else { input.type = 'password'; btn.classList.remove('active'); }
    }

    // 验证码自动跳格
    function moveFocus(el) {
      if (el.value.length === 1 && el.nextElementSibling) {
        el.nextElementSibling.focus();
      }
    }

    // 真实登录 API 接入
    async function doLogin() {
      const acc = document.getElementById('login-account').value;
      const pwd = document.getElementById('login-password').value;
      if (!acc || !pwd) return alert('请输入账号和密码');

      const btn = document.querySelector('#view-login .btn-primary');
      const origText = btn.textContent;
      btn.textContent = '登录中...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: acc, password: pwd })
        });
        const data = await res.json();
        if (res.ok && (data.ok || data.success)) {
          window.location.href = '/dashboard.html'; // 跳转到占位首页
        } else {
          alert(data.error || '账号或密码错误');
        }
      } catch (e) {
        alert('网络异常，请重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
      }
    }

    // 人机验证动画
    document.querySelectorAll('.apex-captcha-box').forEach(box => {
      box.onclick = () => {
        if(box.classList.contains('checked')) return;
        const pct = box.querySelector('.apex-captcha-percent');
        let count = 0;
        const t = setInterval(() => {
          count += 20; 
          if(pct) pct.textContent = count + '%';
          if(count >= 100) { clearInterval(t); box.classList.add('checked'); if(pct) pct.textContent = ''; }
        }, 50);
      }
    });
  </script>
</body>
</html>
