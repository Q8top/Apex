<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17072d">
<title>Sweet Bonanza · 糖果连连爆 · Apex</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/src/css/sweet-demo.css?v=20261006">
</head>
<body class="game-body">
<main class="game-app" id="sweet-game">
  <header class="game-topbar">
    <button class="game-top-btn" id="game-back" type="button" aria-label="返回">‹</button>
    <div class="game-title"><b>SWEET BONANZA</b><span id="game-mode">练习模式 · 虚拟积分</span></div>
    <div class="game-top-actions"><button class="game-top-btn" id="game-lang" type="button" aria-label="Language">EN</button><button class="game-top-btn" id="game-sound" type="button" aria-label="音效">🔊</button><button class="game-top-btn" id="game-help" type="button" aria-label="玩法">?</button></div>
  </header>

  <section class="game-stage" aria-label="游戏区域">
    <div class="stage-backdrop"></div><canvas class="game-fx" id="fx-canvas" aria-hidden="true"></canvas>
    <div class="game-bonus-badge" id="game-bonus" hidden>免费旋转 ×10</div>
    <div class="game-win-banner" id="game-win-banner" aria-live="polite"><small id="win-label">准备好了吗？</small><strong id="win-amount">0.00</strong></div>
    <div class="game-board-frame">
      <div class="game-board" id="game-board" aria-label="6列5行糖果盘面"></div>
      <div class="game-board-shine"></div>
    </div>
    <div class="game-tumble" id="game-tumble" aria-live="polite"></div>
  </section>

  <section class="game-control-panel">
    <div class="game-stat"><span>余额</span><strong id="game-balance">10,000.00</strong></div>
    <div class="game-stat game-stat--win"><span>本局赢得</span><strong id="game-won">0.00</strong></div>
    <div class="game-bet-control"><button id="bet-minus" type="button" aria-label="减少下注">−</button><div><span>下注</span><strong id="game-bet">10.00</strong></div><button id="bet-plus" type="button" aria-label="增加下注">+</button></div>
  </section>

  <section class="game-actions">
    <button class="game-secondary" id="game-auto" type="button">AUTO <span>10</span></button>
    <button class="game-spin" id="game-spin" type="button" aria-label="旋转"><span class="game-spin-icon">↻</span><small id="game-spin-label">旋转</small></button>
    <button class="game-secondary" id="game-turbo" type="button">⚡ <span>快速</span></button>
  </section>

  <div class="game-offline" id="game-offline" hidden>当前处于离线状态：本地虚拟积分模式仍可继续</div><div class="game-overlay" id="game-overlay" aria-live="polite"><div class="game-overlay-card"><small id="game-overlay-title">炸弹倍率</small><strong>×100</strong></div></div><div class="game-live-region" id="game-live" aria-live="assertive"></div>
  <nav class="game-toolbar" aria-label="游戏工具"><button id="game-paytable" type="button">赔付表</button><button id="game-history" type="button">记录</button><button id="game-reset" type="button">重置虚拟积分</button></nav>

  <div class="game-modal" id="game-modal" hidden><div class="game-modal-card"><button class="game-modal-close" id="game-modal-close" type="button">×</button><div id="game-modal-content"></div></div></div>
  <div class="game-toast" id="game-toast" role="status" aria-live="polite"></div>
</main>
<script src="/src/js/sweet.js?v=20261006" defer></script>
<script type="module" src="/src/js/sweet-demo.js?v=20261006"></script>
</body>
</html>
