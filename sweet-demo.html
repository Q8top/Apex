<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>糖果连连爆 · 试玩 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/src/css/sweet-demo.css?v=1">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ic-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="ic-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="ic-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.8-4"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.8 4"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="ic-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="ic-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="ic-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
    <symbol id="ic-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="ic-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></symbol>
    <symbol id="ic-vibrate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M2 9v6M22 9v6"/></symbol>
    <symbol id="ic-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
    <symbol id="ic-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
    <symbol id="ic-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
    <!-- ===== 糖果符号库 ===== -->
    <symbol id="sb-sym-red" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="gRed" cx="0.35" cy="0.3" r="0.7">
          <stop offset="0" stop-color="#ff9a9a"/>
          <stop offset="0.5" stop-color="#ef4444"/>
          <stop offset="1" stop-color="#991b1b"/>
        </radialGradient>
      </defs>
      <path d="M50 78 C22 58 22 38 34 28 C42 22 50 26 50 34 C50 26 58 22 66 28 C78 38 78 58 50 78 Z" fill="url(#gRed)"/>
      <ellipse cx="38" cy="38" rx="7" ry="5" fill="#fff" opacity="0.6"/>
    </symbol>

    <symbol id="sb-sym-blue" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="gBlue" cx="0.35" cy="0.3" r="0.7">
          <stop offset="0" stop-color="#93c5fd"/>
          <stop offset="0.5" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#1e3a8a"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="55" r="30" fill="url(#gBlue)"/>
      <path d="M50 25 Q55 20 60 25 Q55 28 50 25 Z" fill="#22c55e"/>
      <path d="M50 25 L50 32" stroke="#166534" stroke-width="2" fill="none"/>
      <ellipse cx="40" cy="45" rx="9" ry="6" fill="#fff" opacity="0.5"/>
    </symbol>

    <symbol id="sb-sym-green" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="gGreen" cx="0.4" cy="0.32" r="0.7">
          <stop offset="0" stop-color="#bbf7d0"/>
          <stop offset="0.5" stop-color="#22c55e"/>
          <stop offset="1" stop-color="#14532d"/>
        </radialGradient>
      </defs>
      <path d="M50 30 Q28 30 28 55 Q28 82 50 82 Q72 82 72 55 Q72 30 50 30 Z" fill="url(#gGreen)"/>
      <path d="M45 30 Q50 24 55 30" stroke="#14532d" stroke-width="2" fill="none"/>
      <ellipse cx="38" cy="48" rx="8" ry="5" fill="#fff" opacity="0.55"/>
    </symbol>

    <symbol id="sb-sym-yellow" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fef08a"/>
          <stop offset="0.5" stop-color="#facc15"/>
          <stop offset="1" stop-color="#a16207"/>
        </linearGradient>
      </defs>
      <path d="M50 20 L78 50 L50 80 L22 50 Z" fill="url(#gYellow)"/>
      <path d="M50 20 L78 50 L50 50 Z" fill="#fff" opacity="0.3"/>
      <path d="M50 32 L66 50 L50 68 L34 50 Z" fill="#fff" opacity="0.2"/>
    </symbol>

    <symbol id="sb-sym-orange" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="gOrange" cx="0.35" cy="0.32" r="0.72">
          <stop offset="0" stop-color="#fed7aa"/>
          <stop offset="0.5" stop-color="#f97316"/>
          <stop offset="1" stop-color="#7c2d12"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="55" r="30" fill="url(#gOrange)"/>
      <path d="M50 25 Q58 20 62 26 Q56 30 50 28" fill="#22c55e"/>
      <path d="M50 28 L50 35" stroke="#166534" stroke-width="2" fill="none"/>
      <ellipse cx="40" cy="45" rx="9" ry="6" fill="#fff" opacity="0.5"/>
    </symbol>

    <symbol id="sb-sym-purple" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="gPurple" cx="0.35" cy="0.3" r="0.72">
          <stop offset="0" stop-color="#e9d5ff"/>
          <stop offset="0.5" stop-color="#a855f7"/>
          <stop offset="1" stop-color="#581c87"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="60" r="26" fill="url(#gPurple)"/>
      <circle cx="38" cy="46" r="14" fill="url(#gPurple)"/>
      <circle cx="62" cy="46" r="14" fill="url(#gPurple)"/>
      <ellipse cx="38" cy="42" rx="5" ry="3.5" fill="#fff" opacity="0.6"/>
      <ellipse cx="46" cy="52" rx="6" ry="4" fill="#fff" opacity="0.4"/>
    </symbol>

    <symbol id="sb-sym-pink" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="gPink" x1="0.3" y1="0" x2="0.7" y2="1">
          <stop offset="0" stop-color="#fbcfe8"/>
          <stop offset="0.5" stop-color="#ec4899"/>
          <stop offset="1" stop-color="#831843"/>
        </linearGradient>
      </defs>
      <path d="M50 18 L58 42 L82 42 L62 58 L70 82 L50 66 L30 82 L38 58 L18 42 L42 42 Z" fill="url(#gPink)"/>
      <path d="M50 18 L58 42 L50 50 L42 42 Z" fill="#fff" opacity="0.35"/>
    </symbol>

    <symbol id="sb-sym-rainbow" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="gRainbow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ef4444"/>
          <stop offset="0.25" stop-color="#facc15"/>
          <stop offset="0.5" stop-color="#22c55e"/>
          <stop offset="0.75" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="55" r="30" fill="url(#gRainbow)"/>
      <circle cx="50" cy="55" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
      <ellipse cx="40" cy="45" rx="10" ry="7" fill="#fff" opacity="0.5"/>
    </symbol>

  </defs>
</svg>

<header class="sd-header">
  <a class="sd-header-btn" href="/" aria-label="返回大厅">
    <svg class="sd-ic"><use href="#ic-arrow-left"/></svg>
  </a>
  <div class="sd-header-title">
    <span class="sd-header-main">糖果连连爆</span>
    <span class="sd-header-sub">试玩模式</span>
  </div>
  <button type="button" class="sd-header-btn" id="sd-menu-btn" aria-label="打开菜单">
    <svg class="sd-ic"><use href="#ic-menu"/></svg>
  </button>
</header>

<main class="sd-main">
  <section class="sd-stage" aria-label="游戏区域">
    <div class="sd-board" id="sd-board"></div>
    <div class="sd-win-pop" id="sd-win-pop" hidden>
      <span class="sd-win-pop-amount" id="sd-win-pop-amount">¥0.00</span>
    </div>
  </section>

  <section class="sd-stats">
    <div class="sd-stat">
      <span class="sd-stat-label">试玩余额</span>
      <span class="sd-stat-value" id="sd-balance">¥10,000.00</span>
    </div>
    <div class="sd-stat">
      <span class="sd-stat-label">投注金额</span>
      <span class="sd-stat-value" id="sd-bet">¥2.00</span>
    </div>
    <div class="sd-stat">
      <span class="sd-stat-label">本局赢得</span>
      <span class="sd-stat-value" id="sd-win">¥0.00</span>
    </div>
  </section>

  <button type="button" class="sd-reset" id="sd-reset-btn">
    <svg class="sd-ic-sm"><use href="#ic-refresh"/></svg>
    <span>重置余额</span>
  </button>

  <section class="sd-bet" aria-label="投注金额调整">
    <button type="button" class="sd-bet-btn" id="sd-bet-minus" aria-label="减少投注">
      <svg class="sd-ic"><use href="#ic-minus"/></svg>
    </button>
    <div class="sd-bet-value" id="sd-bet-display">¥2.00</div>
    <button type="button" class="sd-bet-btn" id="sd-bet-plus" aria-label="增加投注">
      <svg class="sd-ic"><use href="#ic-plus"/></svg>
    </button>
  </section>

  <section class="sd-controls">
    <button type="button" class="sd-ctrl" id="sd-auto-btn" aria-label="自动旋转">
      <svg class="sd-ic"><use href="#ic-repeat"/></svg>
      <span class="sd-ctrl-label">自动</span>
    </button>
    <button type="button" class="sd-ctrl sd-ctrl--primary" id="sd-spin-btn" aria-label="旋转">
      <svg class="sd-ic-lg"><use href="#ic-rotate"/></svg>
      <span class="sd-ctrl-label">旋转</span>
    </button>
    <button type="button" class="sd-ctrl" id="sd-fast-btn" aria-label="极速模式">
      <svg class="sd-ic"><use href="#ic-zap"/></svg>
      <span class="sd-ctrl-label">极速</span>
    </button>
  </section>
</main>

<div class="sd-sheet-root" id="sd-sheet-root" hidden>
  <div class="sd-sheet-backdrop" data-sheet-close="1"></div>
  <div class="sd-sheet" role="dialog" aria-modal="true" aria-labelledby="sd-sheet-title">
    <div class="sd-sheet-handle"></div>
    <header class="sd-sheet-header">
      <h2 class="sd-sheet-title" id="sd-sheet-title">糖果连连爆</h2>
      <p class="sd-sheet-sub">游戏菜单</p>
    </header>
    <nav class="sd-sheet-nav">
      <button type="button" class="sd-sheet-item" data-sheet-action="rules"><svg class="sd-ic"><use href="#ic-book"/></svg><span>游戏规则</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="history"><svg class="sd-ic"><use href="#ic-history"/></svg><span>游戏记录</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="settings"><svg class="sd-ic"><use href="#ic-settings"/></svg><span>游戏设置</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="sound"><svg class="sd-ic"><use href="#ic-volume"/></svg><span>音效设置</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="vibrate"><svg class="sd-ic"><use href="#ic-vibrate"/></svg><span>震动反馈</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="help"><svg class="sd-ic"><use href="#ic-help"/></svg><span>游戏帮助</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item sd-sheet-item--home" data-sheet-action="home"><svg class="sd-ic"><use href="#ic-home"/></svg><span>返回大厅</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
    </nav>
  </div>
</div>

<div class="sd-confirm-root" id="sd-confirm-root" hidden>
  <div class="sd-confirm-backdrop" data-confirm-close="1"></div>
  <div class="sd-confirm" role="alertdialog" aria-modal="true">
    <h3 class="sd-confirm-title">重置试玩余额？</h3>
    <p class="sd-confirm-body">
      当前试玩余额：<strong id="sd-confirm-current">¥0.00</strong><br>
      重置后恢复为：<strong>¥10,000.00</strong>
    </p>
    <div class="sd-confirm-actions">
      <button type="button" class="sd-confirm-btn" id="sd-confirm-cancel">取消</button>
      <button type="button" class="sd-confirm-btn sd-confirm-btn--primary" id="sd-confirm-ok">确认重置</button>
    </div>
  </div>
</div>

<script src="/src/js/inline/sweet-demo.js?v=1"></script>
</body>
</html>
