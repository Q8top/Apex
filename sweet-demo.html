<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>糖果连连爆 · 试玩 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <symbol id="ic-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0114-3l3 3M20 15a8 8 0 01-14 3l-3-3M17 6v3h3M7 18v-3H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-rotate" viewBox="0 0 24 24"><path d="M12 5a7 7 0 107 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 2v6l3-3z" fill="currentColor"/></symbol>
    <symbol id="ic-zap" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/></symbol>
    <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-book" viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 013 3v11H7a3 3 0 01-3-3V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 16h14" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ic-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

      <symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>

  </defs></svg>

<header class="sd-header">
  <a class="sd-header-back" href="/" aria-label="返回大厅">
    <svg class="sd-ic"><use href="#ic-arrow-left"/></svg>
  </a>
  <div class="sd-header-brand">
    <img class="sd-header-icon" src="/assets/games/sweet.webp" alt="" draggable="false">
    <div class="sd-header-text">
      <span class="sd-header-main" data-i18n="game.title">糖果连连爆</span>
      <span class="sd-header-sub" data-i18n="game.demo">试玩模式</span>
    </div>
  </div>
  <span class="sd-header-pill">
    <span class="sd-header-pill-dot"></span>
    <span data-i18n="game.demo">试玩模式</span>
  </span>
  <button type="button" class="sd-header-menu" id="sd-menu-btn" aria-label="打开菜单">
    <svg class="sd-ic"><use href="#ic-menu"/></svg>
  </button>
</header>

<main class="sd-main">
  <div class="sd-banner" aria-hidden="true">
    <span class="sd-banner-line"></span>
    <span class="sd-banner-text">甜蜜连线 · 赢取大奖</span>
    <span class="sd-banner-line"></span>
  </div>

  <section class="sd-stage" aria-label="游戏区域">
    <div class="sd-board" id="sd-board"></div>
    <div class="sd-fs-flash" id="sd-fs-flash" hidden></div>
    <div class="sd-tumble-counter" id="sd-tumble-counter" hidden></div>
    <button type="button" class="sd-skip-btn" id="sd-skip-btn" hidden data-i18n="btn.skip">跳过</button>
  </section>

  <section class="sd-win-area" aria-live="polite" aria-atomic="true">
    <div class="sd-win-fb" id="sd-win-fb">
      <svg class="sd-win-fb-star" aria-hidden="true"><use href="#ic-star"/></svg>
      <span class="sd-win-fb-label" id="sd-win-fb-label" data-i18n="stat.win">本局赢得</span>
      <strong class="sd-win-fb-value" id="sd-win-fb-value">¥0.00</strong>
      <span class="sd-win-fb-wheat sd-win-fb-wheat--l" aria-hidden="true"></span>
      <span class="sd-win-fb-wheat sd-win-fb-wheat--r" aria-hidden="true"></span>
    </div>
  </section>
  <section class="sd-stats">
    <div class="sd-stat">
      <span class="sd-stat-ic"><svg><use href="#ic-wallet"/></svg></span>
      <span class="sd-stat-label" data-i18n="stat.balance">余额</span>
      <span class="sd-stat-value" id="sd-balance">¥10,000.00</span>
    </div>
    <div class="sd-stat">
      <span class="sd-stat-ic"><svg><use href="#ic-chips"/></svg></span>
      <span class="sd-stat-label" data-i18n="stat.bet">下注</span>
      <span class="sd-stat-value" id="sd-bet">¥2.00</span>
    </div>
    <div class="sd-stat sd-stat--win">
      <span class="sd-stat-ic"><svg><use href="#ic-star"/></svg></span>
      <span class="sd-stat-label" data-i18n="stat.win">本局赢得</span>
      <span class="sd-stat-value" id="sd-win" aria-live="polite" aria-atomic="true">¥0.00</span>
    </div>
  </section>

  <section class="sd-bet" aria-label="投注金额调整">
    <button type="button" class="sd-bet-btn" id="sd-bet-minus" aria-label="减少投注">
      <svg class="sd-ic"><use href="#ic-minus"/></svg>
    </button>
    <div class="sd-bet-center">
      <span class="sd-bet-value" id="sd-bet-display">¥2.00</span>
      <span class="sd-bet-caption" data-i18n="stat.bet">投注金额</span>
    </div>
    <button type="button" class="sd-bet-btn" id="sd-bet-plus" aria-label="增加投注">
      <svg class="sd-ic"><use href="#ic-plus"/></svg>
    </button>
  </section>

  <section class="sd-controls">
    <button type="button" class="sd-ctrl" id="sd-auto-btn" aria-label="自动旋转">
      <svg class="sd-ic"><use href="#ic-repeat"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.auto">自动</span>
    </button>
    <button type="button" class="sd-ctrl sd-ctrl--primary" id="sd-spin-btn" aria-label="旋转">
      <svg class="sd-ic-lg"><use href="#ic-rotate"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.spin">旋转</span>
    </button>
    <button type="button" class="sd-ctrl" id="sd-fast-btn" aria-label="极速模式">
      <svg class="sd-ic"><use href="#ic-zap"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.fast">极速</span>
    </button>
  </section>

  <button type="button" class="sd-reset" id="sd-reset-btn">
    <svg class="sd-ic-sm"><use href="#ic-refresh"/></svg>
    <span data-i18n="btn.reset">重置余额</span>
  </button>
</main>

<nav class="sd-tabbar" aria-label="底部导航">
  <a class="sd-tab sd-tab--active" href="/" aria-label="首页">
    <svg class="sd-tab-ic"><use href="#ic-home"/></svg>
    <span class="sd-tab-label">首页</span>
  </a>
  <button type="button" class="sd-tab" data-sheet-action="history" aria-label="记录">
    <svg class="sd-tab-ic"><use href="#ic-history"/></svg>
    <span class="sd-tab-label">记录</span>
  </button>
  <button type="button" class="sd-tab" data-sheet-action="settings" aria-label="设置">
    <svg class="sd-tab-ic"><use href="#ic-settings"/></svg>
    <span class="sd-tab-label">设置</span>
  </button>
</nav>

<div class="sd-sheet-root" id="sd-sheet-root" hidden>
  <div class="sd-sheet-backdrop" data-sheet-close="1"></div>
  <div class="sd-sheet" role="dialog" aria-modal="true" aria-labelledby="sd-sheet-title">
    <div class="sd-sheet-handle"></div>
    <header class="sd-sheet-header">
      <h2 class="sd-sheet-title" id="sd-sheet-title" data-i18n="game.title">糖果连连爆</h2>
      <p class="sd-sheet-sub" data-i18n="game.menu">游戏菜单</p>
    </header>
    <nav class="sd-sheet-nav">
      <button type="button" class="sd-sheet-item" data-sheet-action="rules"><svg class="sd-ic"><use href="#ic-book"/></svg><span data-i18n="menu.rules">游戏规则</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="history"><svg class="sd-ic"><use href="#ic-history"/></svg><span data-i18n="menu.history">游戏记录</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="settings"><svg class="sd-ic"><use href="#ic-settings"/></svg><span data-i18n="menu.settings">游戏设置</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item sd-sheet-item--home" data-sheet-action="home"><svg class="sd-ic"><use href="#ic-home"/></svg><span data-i18n="menu.home">返回大厅</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
    </nav>
  </div>
</div>

<div class="sd-confirm-root" id="sd-confirm-root" hidden>
  <div class="sd-confirm-backdrop" data-confirm-close="1"></div>
  <div class="sd-confirm" role="alertdialog" aria-modal="true">
    <h3 class="sd-confirm-title">重置试玩余额？</h3>
    <p class="sd-confirm-body">
      当前试玩余额：<strong id="sd-confirm-current">¥0.00</strong><br>
      重置后恢复为：<strong>¥10,000.00</strong>
    </p>
    <div class="sd-confirm-actions">
      <button type="button" class="sd-confirm-btn" id="sd-confirm-cancel">取消</button>
      <button type="button" class="sd-confirm-btn sd-confirm-btn--primary" id="sd-confirm-ok">确认重置</button>
    </div>
  </div>
</div>
