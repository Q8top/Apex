<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0b1f">
<meta name="format-detection" content="telephone=no">
<title>糖果连连爆 · 试玩 · Apex</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/css/sweet.css">
<link rel="stylesheet" href="/src/css/sweet-demo.css?v=1791214187">
</head>
<body class="sd-demo-body">
<main class="demo-shell">

  <header class="demo-header">
    <button class="demo-header__icon" type="button" id="demo-back" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="demo-header__title">
      <span class="demo-header__name" id="demo-name">糖果连连爆</span>
      <span class="demo-header__badge" id="demo-badge">试玩模式</span>
    </div>
    <button class="demo-header__icon" type="button" id="demo-menu" aria-label="菜单">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </header>

  <section class="demo-board" aria-label="游戏盘面">
    <div class="demo-reels" id="demo-reels"></div>
    <div class="demo-win" id="demo-win">
      <div class="demo-win__label">本局中奖</div>
      <div class="demo-win__amount" id="demo-win-amount">¥0.00</div>
    </div>
  </section>

  <section class="demo-reset">
    <button class="demo-reset__btn" type="button" id="demo-reset">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
      <span id="demo-reset-label">重置余额</span>
    </button>
  </section>

  <section class="demo-stats">
    <div class="demo-stat">
      <div class="demo-stat__k">余额</div>
      <div class="demo-stat__v" id="demo-balance">¥10,000.00</div>
    </div>
    <div class="demo-stat">
      <div class="demo-stat__k">下注</div>
      <div class="demo-stat__v" id="demo-bet">¥10.00</div>
    </div>
    <div class="demo-stat">
      <div class="demo-stat__k">赢得</div>
      <div class="demo-stat__v demo-stat__v--win" id="demo-won">¥0.00</div>
    </div>
  </section>

  <section class="demo-bet">
    <button class="demo-bet__btn" type="button" id="demo-bet-minus" aria-label="减少下注">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="demo-bet__display">
      <div class="demo-bet__k">下注</div>
      <div class="demo-bet__v" id="demo-bet-display">¥10.00</div>
    </div>
    <button class="demo-bet__btn" type="button" id="demo-bet-plus" aria-label="增加下注">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
    </button>
  </section>

  <section class="demo-spin">
    <button class="demo-spin__btn" type="button" id="demo-spin">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
      <span>旋转</span>
    </button>
  </section>

  <section class="demo-actions">
    <button class="demo-action" type="button" id="demo-auto">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>自动</span>
    </button>
    <button class="demo-action" type="button" id="demo-history">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      <span>记录</span>
    </button>
    <button class="demo-action" type="button" id="demo-paytable">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>
      <span>赔付</span>
    </button>
  </section>

</main>

<script src="/src/js/sweet.js" defer></script>
<script src="/src/js/sweet-demo.js" defer></script>
</body>
</html>
