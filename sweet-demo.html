<header class="sd-header">
  <a class="sd-header-btn" href="/" aria-label="返回大厅">
    <svg class="sd-ic"><use href="#ic-arrow-left"/></svg>
  </a>
  <div class="sd-header-title">
    <span class="sd-header-main" data-i18n="game.title">糖果连连爆</span>
    <span class="sd-header-sub" data-i18n="game.demo">试玩模式</span>
  </div>
  <button type="button" class="sd-header-btn" id="sd-menu-btn" aria-label="打开菜单">
    <svg class="sd-ic"><use href="#ic-menu"/></svg>
  </button>
</header>

<main class="sd-main">
  <section class="sd-stage" aria-label="游戏区域">
    <div class="sd-board" id="sd-board"></div>
    <button type="button" class="sd-skip-btn" id="sd-skip-btn" hidden data-i18n="btn.skip">跳过</button>
  </section>

    <section class="sd-win-area" aria-live="polite" aria-atomic="true">
    <div class="sd-win-fb" id="sd-win-fb">
      <span class="sd-win-fb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.4 9.2 L22 9.6 L16 14 L18 21.4 L12 17 L6 21.4 L8 14 L2 9.6 L9.6 9.2 Z"/></svg></span>
      <span class="sd-win-fb-label" id="sd-win-fb-label">本局赢得</span>
      <strong class="sd-win-fb-value" id="sd-win-fb-value">¥0.00</strong>
    </div>
  </section>
<section class="sd-stats">
    <div class="sd-stat">
      <span class="sd-stat-label" data-i18n="stat.balance">试玩余额</span>
      <span class="sd-stat-value" id="sd-balance">¥10,000.00</span>
    </div>
    <div class="sd-stat">
      <span class="sd-stat-label" data-i18n="stat.bet">投注金额</span>
      <span class="sd-stat-value" id="sd-bet">¥2.00</span>
    </div>
    <div class="sd-stat">
      <span class="sd-stat-label" data-i18n="stat.win">本局赢得</span>
      <span class="sd-stat-value" id="sd-win" aria-live="polite" aria-atomic="true">¥0.00</span>
    </div>
  </section>

  <button type="button" class="sd-reset" id="sd-reset-btn">
    <svg class="sd-ic-sm"><use href="#ic-refresh"/></svg>
    <span data-i18n="btn.reset">重置余额</span>
  </button>

  <section class="sd-bet" aria-label="投注金额调整">
    <button type="button" class="sd-bet-btn" id="sd-bet-minus" aria-label="减少投注">
      <svg class="sd-ic"><use href="#ic-minus"/></svg>
    </button>
    <div class="sd-bet-value" id="sd-bet-display">¥2.00</div>
    <button type="button" class="sd-bet-btn" id="sd-bet-plus" aria-label="增加投注">
      <svg class="sd-ic"><use href="#ic-plus"/></svg>
    </button>
  </section>

  <section class="sd-controls">
    <button type="button" class="sd-ctrl" id="sd-auto-btn" aria-label="自动旋转">
      <svg class="sd-ic"><use href="#ic-repeat"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.auto">自动</span>
    </button>
    <button type="button" class="sd-ctrl sd-ctrl--primary" id="sd-spin-btn" aria-label="旋转">
      <svg class="sd-ic-lg"><use href="#ic-rotate"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.spin">旋转</span>
    </button>
    <button type="button" class="sd-ctrl" id="sd-fast-btn" aria-label="极速模式">
      <svg class="sd-ic"><use href="#ic-zap"/></svg>
      <span class="sd-ctrl-label" data-i18n="btn.fast">极速</span>
    </button>
  </section>
</main>

<div class="sd-sheet-root" id="sd-sheet-root" hidden>
  <div class="sd-sheet-backdrop" data-sheet-close="1"></div>
  <div class="sd-sheet" role="dialog" aria-modal="true" aria-labelledby="sd-sheet-title">
    <div class="sd-sheet-handle"></div>
    <header class="sd-sheet-header">
      <h2 class="sd-sheet-title" id="sd-sheet-title" data-i18n="game.title">糖果连连爆</h2>
      <p class="sd-sheet-sub" data-i18n="game.menu">游戏菜单</p>
    </header>
    <nav class="sd-sheet-nav">
      <button type="button" class="sd-sheet-item" data-sheet-action="rules"><svg class="sd-ic"><use href="#ic-book"/></svg><span data-i18n="menu.rules">游戏规则</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="history"><svg class="sd-ic"><use href="#ic-history"/></svg><span data-i18n="menu.history">游戏记录</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="settings"><svg class="sd-ic"><use href="#ic-settings"/></svg><span data-i18n="menu.settings">游戏设置</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="sound"><svg class="sd-ic"><use href="#ic-volume"/></svg><span data-i18n="menu.sound">音效设置</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="vibrate"><svg class="sd-ic"><use href="#ic-vibrate"/></svg><span data-i18n="menu.vibrate">震动反馈</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item" data-sheet-action="help"><svg class="sd-ic"><use href="#ic-help"/></svg><span data-i18n="menu.help">游戏帮助</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
      <button type="button" class="sd-sheet-item sd-sheet-item--home" data-sheet-action="home"><svg class="sd-ic"><use href="#ic-home"/></svg><span data-i18n="menu.home">返回大厅</span><svg class="sd-ic-sm sd-sheet-chevron"><use href="#ic-chevron-right"/></svg></button>
    </nav>
  </div>
</div>

<div class="sd-confirm-root" id="sd-confirm-root" hidden>
  <div class="sd-confirm-backdrop" data-confirm-close="1"></div>
  <div class="sd-confirm" role="alertdialog" aria-modal="true">

      <button type="button" class="sd-confirm-btn sd-confirm-btn--primary" id="sd-confirm-ok">确认重置</button>
    </div>
  </div>
</div>
