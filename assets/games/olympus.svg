<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140" width="200" height="200">
  <defs>
    <radialGradient id="ol-bg5" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8a5dd0"/>
      <stop offset="100%" stop-color="#2a1650"/>
    </radialGradient>
    <linearGradient id="ol-gold5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b8"/>
      <stop offset="40%" stop-color="#f0c33e"/>
      <stop offset="100%" stop-color="#a07020"/>
    </linearGradient>
  </defs>

  <!-- 紫底卡片（与 lucky-fruit 对齐内缩） -->
  <rect x="42" y="42" width="116" height="116" rx="26" fill="url(#ol-bg5)"/>
  <rect x="42.5" y="42.5" width="115" height="115" rx="25.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="48" y="48" width="104" height="104" rx="20" fill="none" stroke="rgba(240,200,80,.45)" stroke-width="1"/>

  <!-- 光晕 -->
  <circle cx="100" cy="102" r="34" fill="rgba(255,240,180,.12)"/>

  <!-- 金色闪电（更精致：双段折线 + 内高光） -->
  <path d="M106 56 L74 100 L90 100 L84 146 L118 96 L100 96 Z"
        fill="url(#ol-gold5)" stroke="#0a0a0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M106 56 L80 94 L90 94" fill="none" stroke="#fff8d0" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- 顶部小皇冠 -->
  <path d="M66 70 L66 60 L74 65 L82 56 L90 65 L98 60 L98 70 Z"
        fill="url(#ol-gold5)" stroke="#0a0a0a" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="82" cy="65" r="1.4" fill="#e5484d" stroke="#0a0a0a" stroke-width=".6"/>

  <!-- 星点 -->
  <circle cx="130" cy="72" r="1.6" fill="#fff3b8"/>
  <circle cx="62" cy="140" r="1.4" fill="#fff3b8" opacity=".8"/>
  <circle cx="128" cy="132" r="1.2" fill="#fff3b8" opacity=".65"/>
</svg>
