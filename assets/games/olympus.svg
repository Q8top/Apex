<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Olympus">
  <defs>
    <radialGradient id="og" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </radialGradient>
    <linearGradient id="og-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
    <linearGradient id="og-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="100%" stop-color="#e0b52f"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#og)"/>

  <!-- 拱门 -->
  <path d="M50 150 L50 90 Q50 60 100 60 Q150 60 150 90 L150 150 Z"
        fill="none" stroke="url(#og-gold)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 150 L64 94 Q64 76 100 76 Q136 76 136 94 L136 150"
        fill="none" stroke="#d4af37" stroke-width="2" opacity=".55"/>

  <!-- 闪电 -->
  <path d="M108 52 L84 108 L100 108 L90 152 L124 92 L108 92 Z"
        fill="url(#og-bolt)" stroke="#1a1a1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 星点 -->
  <circle cx="52" cy="48" r="2.2" fill="#d4af37"/>
  <circle cx="150" cy="46" r="1.8" fill="#d4af37"/>
  <circle cx="162" cy="120" r="1.6" fill="#d4af37" opacity=".7"/>
  <circle cx="40" cy="118" r="1.6" fill="#d4af37" opacity=".7"/>
</svg>
