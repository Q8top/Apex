<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140" width="200" height="200">
  <defs>
    <radialGradient id="ol-bg3" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#7a52c0"/>
      <stop offset="100%" stop-color="#2a1650"/>
    </radialGradient>
    <linearGradient id="ol-gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e08a"/>
      <stop offset="100%" stop-color="#b88b24"/>
    </linearGradient>
  </defs>

  <!-- 圆角正方形底（占满画布） -->
  <rect x="30" y="30" width="140" height="140" rx="32" fill="url(#ol-bg3)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="31.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="38" y="38" width="124" height="124" rx="24" fill="none" stroke="rgba(240,200,80,.4)" stroke-width="1.2"/>

  <!-- 金色闪电（大，占满画面中心） -->
  <path d="M112 40 L68 106 L96 106 L86 168 L132 100 L102 100 Z"
        fill="url(#ol-gold3)" stroke="#0a0a0a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M112 40 L78 94 L90 94" fill="none" stroke="#fff8d0" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>

  <!-- 王冠（顶部） -->
  <path d="M60 62 L60 48 L70 56 L82 44 L94 56 L104 48 L104 62 Z"
        fill="url(#ol-gold3)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="82" cy="56" r="1.8" fill="#e5484d" stroke="#0a0a0a" stroke-width=".8"/>

  <!-- 星点 -->
  <circle cx="140" cy="58" r="2" fill="#f7e08a"/>
  <circle cx="54" cy="150" r="1.6" fill="#f7e08a" opacity=".85"/>
  <circle cx="146" cy="140" r="1.4" fill="#f7e08a" opacity=".7"/>
</svg>
