<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140" width="200" height="200">
  <defs>
    <radialGradient id="ol-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f6"/>
    </radialGradient>
    <linearGradient id="ol-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="32" y="32" width="136" height="136" rx="24" fill="url(#ol-bg)"/>
  <rect x="32.5" y="32.5" width="135" height="135" rx="23.5" fill="none" stroke="#e5e5e7" stroke-width="1"/>

  <!-- 立柱（神庙双柱） -->
  <rect x="46" y="70" width="6" height="60" fill="#fafafa" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="148" y="70" width="6" height="60" fill="#fafafa" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="42" y="66" width="14" height="6" rx="1" fill="#0a0a0a"/>
  <rect x="144" y="66" width="14" height="6" rx="1" fill="#0a0a0a"/>

  <!-- 山形屋顶 -->
  <path d="M38 66 L100 40 L162 66 Z" fill="#0a0a0a"/>
  <path d="M48 66 L100 46 L152 66 Z" fill="url(#ol-gold)" stroke="#0a0a0a" stroke-width="1"/>

  <!-- 王冠 -->
  <path d="M74 108 L74 88 L86 98 L100 84 L114 98 L126 88 L126 108 Z" fill="url(#ol-gold)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="74" y="108" width="52" height="6" rx="1.5" fill="url(#ol-gold)" stroke="#0a0a0a" stroke-width="1.6"/>
  <circle cx="100" cy="98" r="2.4" fill="#e5484d" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="86" cy="103" r="1.6" fill="#4a90d0" stroke="#0a0a0a" stroke-width=".8"/>
  <circle cx="114" cy="103" r="1.6" fill="#3f9a4a" stroke="#0a0a0a" stroke-width=".8"/>

  <!-- 底部台阶 -->
  <rect x="40" y="130" width="120" height="5" rx="1" fill="#0a0a0a"/>
  <rect x="48" y="137" width="104" height="3" rx="1" fill="#0a0a0a" opacity=".6"/>
