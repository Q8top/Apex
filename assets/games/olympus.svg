<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ol-bg6" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f6"/>
    </radialGradient>
    <linearGradient id="ol-gold6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
  </defs>

  <!-- 外框（140×140 居中，与 lucky-fruit 完全一致） -->
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#ol-bg6)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(201,162,39,.35)" stroke-width="1"/>

  <!-- 内容（缩到 60%） -->
  <g transform="translate(100,100) scale(0.6) translate(-100,-100)">
    <!-- 金色闪电 -->
    <path d="M108 58 L76 100 L92 100 L86 144 L118 96 L100 96 Z"
          fill="url(#ol-gold6)" stroke="#0a0a0a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- 顶部小皇冠 -->
    <path d="M64 70 L64 58 L74 65 L84 54 L94 65 L104 58 L104 70 Z"
          fill="url(#ol-gold6)" stroke="#0a0a0a" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="84" cy="64" r="2.4" fill="#e5484d" stroke="#0a0a0a" stroke-width=".9"/>

    <!-- 底部横线（与 lucky-fruit 投币口呼应） -->
    <rect x="84" y="152" width="32" height="3" rx="1.5" fill="#0a0a0a"/>
  </g>
</svg>
