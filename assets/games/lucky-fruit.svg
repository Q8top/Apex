<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
    <linearGradient id="lf-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <g>
    <!-- 机头 -->
    <path d="M52 58 L148 58 L148 72 L52 72 Z" fill="#0a0a0a"/>
    <circle cx="62" cy="65" r="2.4" fill="#4ade80"/>
    <circle cx="72" cy="65" r="2.4" fill="#e8c25c"/>
    <circle cx="82" cy="65" r="2.4" fill="#ef5350"/>

    <!-- 三个转轮 -->
    <rect x="52" y="80" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.4"/>
    <rect x="86" y="80" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.4"/>
    <rect x="120" y="80" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.4"/>

    <!-- 樱桃 -->
    <circle cx="62" cy="116" r="6" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.6"/>
    <circle cx="76" cy="120" r="6" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.6"/>
    <path d="M62 108 Q66 100 70 96" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M76 112 Q74 104 70 96" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- 7 -->
    <text x="100" y="128" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="900" fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.6" paint-order="stroke">7</text>

    <!-- 星 -->
    <path d="M130 100 L133 111 L144 111 L135 118 L138 129 L130 122 L122 129 L125 118 L116 111 L127 111 Z"
          fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- 投币口 -->
    <rect x="88" y="156" width="24" height="3" rx="1.5" fill="#0a0a0a"/>
  </g>
</svg>
