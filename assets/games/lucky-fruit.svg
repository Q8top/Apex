<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
    <linearGradient id="lf-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <g>
    <!-- 机头 -->
    <path d="M52 62 L148 62 L148 76 L52 76 Z" fill="#0a0a0a"/>
    <circle cx="62" cy="69" r="2.4" fill="#4ade80"/>
    <circle cx="72" cy="69" r="2.4" fill="#e8c25c"/>
    <circle cx="82" cy="69" r="2.4" fill="#ef5350"/>

    <!-- 三转轮 -->
    <rect x="52" y="84" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.6"/>
    <rect x="86" y="84" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.6"/>
    <rect x="120" y="84" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.6"/>

    <!-- 樱桃 -->
    <circle cx="62" cy="118" r="6" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.6"/>
    <circle cx="76" cy="122" r="6" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.6"/>
    <path d="M62 110 Q66 102 70 98" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M76 114 Q74 106 70 98" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- 7 -->
    <text x="100" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="900" fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.8" paint-order="stroke">7</text>

    <!-- 星 -->
    <path d="M134 100 L137 112 L149 112 L139 119 L142 131 L134 124 L126 131 L129 119 L119 112 L131 112 Z"
          fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- 投币口 -->
    <rect x="88" y="160" width="24" height="3" rx="1.5" fill="#0a0a0a"/>
  </g>
</svg>
