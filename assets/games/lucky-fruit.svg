<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="lf-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f6"/>
    </radialGradient>
    <linearGradient id="lf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
    <linearGradient id="lf-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c62828"/>
