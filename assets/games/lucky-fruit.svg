  </defs>

  <!-- 白底外框 -->
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#lf-bg)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(201,162,39,.35)" stroke-width="1"/>

  <!-- 内容缩到 60% 居中 -->
  <g transform="translate(100,100) scale(0.58) translate(-100,-100)">
    <path d="M52 62 L148 62 L148 76 L52 76 Z" fill="#0a0a0a"/>
    <circle cx="62" cy="69" r="2.4" fill="#4ade80"/>
    <circle cx="72" cy="69" r="2.4" fill="#e8c25c"/>
    <circle cx="82" cy="69" r="2.4" fill="#ef5350"/>

    <rect x="52" y="84" width="28" height="68" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="2.6"/>
