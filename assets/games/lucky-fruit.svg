<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140" width="200" height="200">
  <defs>
    <radialGradient id="lf-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f6"/>
    </radialGradient>
    <linearGradient id="lf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e08a"/>
      <stop offset="100%" stop-color="#b88b24"/>
    </linearGradient>
    <linearGradient id="lf-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <!-- 白底卡片（内缩，对齐 olympus） -->
  <rect x="42" y="42" width="116" height="116" rx="26" fill="url(#lf-bg)"/>
  <rect x="42.5" y="42.5" width="115" height="115" rx="25.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="48" y="48" width="104" height="104" rx="20" fill="none" stroke="rgba(201,162,39,.35)" stroke-width="1"/>

  <!-- 机头（黑条） -->
  <path d="M58 66 L142 66 L142 78 L58 78 Z" fill="#0a0a0a"/>
  <circle cx="66" cy="72" r="2" fill="#4ade80"/>
  <circle cx="74" cy="72" r="2" fill="#e8c25c"/>
  <circle cx="82" cy="72" r="2" fill="#ef5350"/>

  <!-- 三个转轮 -->
  <rect x="58" y="84" width="24" height="52" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.8"/>
  <rect x="88" y="84" width="24" height="52" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.8"/>
  <rect x="118" y="84" width="24" height="52" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.8"/>

  <!-- 樱桃 -->
  <circle cx="66" cy="112" r="5" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="78" cy="116" r="5" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="1.2"/>
  <path d="M66 106 Q70 100 72 96" stroke="#0a0a0a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M78 110 Q76 102 72 96" stroke="#0a0a0a" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- 7 -->
  <text x="100" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="900" fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.4" paint-order="stroke">7</text>

  <!-- 星 -->
  <path d="M126 100 L129 110 L139 110 L131 116 L134 126 L126 120 L118 126 L121 116 L113 110 L123 110 Z"
        fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- 投币口 -->
  <rect x="90" y="146" width="20" height="3" rx="1.5" fill="#0a0a0a"/>
</svg>
