<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c25c"/>
      <stop offset="100%" stop-color="#c49a2f"/>
    </linearGradient>
    <linearGradient id="lf-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <g>
    <!-- 机头黑条 -->
    <path d="M22 36 L178 36 L178 60 L22 60 Z" fill="#0a0a0a"/>
    <circle cx="38" cy="48" r="4" fill="#4ade80"/>
    <circle cx="56" cy="48" r="4" fill="#e8c25c"/>
    <circle cx="74" cy="48" r="4" fill="#ef5350"/>

    <!-- 三个转轮 -->
    <rect x="22" y="72" width="46" height="98" rx="14" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
    <rect x="77" y="72" width="46" height="98" rx="14" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
    <rect x="132" y="72" width="46" height="98" rx="14" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>

    <!-- 樱桃 -->
    <circle cx="38" cy="128" r="10" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="2.4"/>
    <circle cx="58" cy="134" r="10" fill="url(#lf-red)" stroke="#0a0a0a" stroke-width="2.4"/>
    <path d="M38 118 Q44 106 50 100" stroke="#0a0a0a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M58 124 Q55 110 50 100" stroke="#0a0a0a" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- 7 -->
    <text x="100" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="60" font-weight="900" fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="3" paint-order="stroke">7</text>

    <!-- 星 -->
    <path d="M155 102 L160 122 L181 122 L164 135 L170 155 L155 143 L140 155 L146 135 L129 122 L150 122 Z"
          fill="url(#lf-gold)" stroke="#0a0a0a" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- 底部投币口 -->
    <rect x="70" y="180" width="60" height="6" rx="3" fill="#0a0a0a"/>
  </g>
</svg>
