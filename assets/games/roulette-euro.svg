<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="reu-bg" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f4f6"/></radialGradient>
    <radialGradient id="reu-rim" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="#c9a227"/><stop offset="65%" stop-color="#8a6a18"/><stop offset="100%" stop-color="#4a3810"/></radialGradient>
  </defs>
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#reu-bg)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(200,40,40,.35)" stroke-width="1"/>
  <g transform="translate(100,100) scale(0.9) translate(-100,-100)">
    <!-- 外圈金边 -->
    <circle cx="100" cy="100" r="58" fill="url(#reu-rim)" stroke="#0a0a0a" stroke-width="2.6"/>
    <circle cx="100" cy="100" r="52" fill="#3a2a10" stroke="#0a0a0a" stroke-width="1.5"/>
    <!-- 红黑扇形（简化 8 段） -->
    <g transform="translate(100,100)">
      <path d="M0 0 L0 -50 A50 50 0 0 1 35.4 -35.4 Z" fill="#c82828"/>
      <path d="M0 0 L35.4 -35.4 A50 50 0 0 1 50 0 Z" fill="#0a0a0a"/>
      <path d="M0 0 L50 0 A50 50 0 0 1 35.4 35.4 Z" fill="#c82828"/>
      <path d="M0 0 L35.4 35.4 A50 50 0 0 1 0 50 Z" fill="#0a0a0a"/>
      <path d="M0 0 L0 50 A50 50 0 0 1 -35.4 35.4 Z" fill="#c82828"/>
      <path d="M0 0 L-35.4 35.4 A50 50 0 0 1 -50 0 Z" fill="#0a0a0a"/>
      <path d="M0 0 L-50 0 A50 50 0 0 1 -35.4 -35.4 Z" fill="#c82828"/>
      <path d="M0 0 L-35.4 -35.4 A50 50 0 0 1 0 -50 Z" fill="#0a0a0a"/>
      <!-- 单 0 绿色顶格 -->
      <path d="M0 -50 A50 50 0 0 1 6 -49.6 L0 -42 Z" fill="#0a8a3a" stroke="#fff" stroke-width=".5"/>
    </g>
    <!-- 中心轴 -->
    <circle cx="100" cy="100" r="20" fill="#5a3a18" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="100" cy="100" r="14" fill="url(#reu-rim)" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="4" fill="#0a0a0a"/>
    <!-- 球 -->
    <circle cx="100" cy="42" r="5" fill="#fff" stroke="#0a0a0a" stroke-width="1.2"/>
    <ellipse cx="98.5" cy="40.5" rx="1.8" ry="1.2" fill="#fff" opacity=".9"/>
  </g>
</svg>
