<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cr-bg" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f4f6"/></radialGradient>
    <linearGradient id="cr-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a4f0a8"/><stop offset="50%" stop-color="#5ac468"/><stop offset="100%" stop-color="#1e6028"/></linearGradient>
    <radialGradient id="cr-burst" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#fff8c0"/><stop offset="40%" stop-color="#ffe060"/><stop offset="100%" stop-color="#e8a020"/></radialGradient>
  </defs>
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#cr-bg)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(90,196,104,.35)" stroke-width="1"/>
  <g transform="translate(100,100) scale(0.82) translate(-100,-100)">
    <!-- 网格底 -->
    <path d="M30 160 L170 160" stroke="#0a0a0a" stroke-width="1" opacity=".15"/>
    <path d="M30 130 L170 130" stroke="#0a0a0a" stroke-width=".6" opacity=".08"/>
    <path d="M30 100 L170 100" stroke="#0a0a0a" stroke-width=".6" opacity=".08"/>
    <path d="M30 70 L170 70" stroke="#0a0a0a" stroke-width=".6" opacity=".08"/>
    <path d="M30 40 L170 40" stroke="#0a0a0a" stroke-width=".6" opacity=".08"/>
    <!-- 上升曲线（带阴影） -->
    <path d="M32 158 Q60 150 82 130 Q110 105 138 60 L142 50" stroke="#0a0a0a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".12"/>
    <path d="M32 158 Q60 150 82 130 Q110 105 138 60 L142 50" stroke="url(#cr-green)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- 爆炸星云 -->
    <g transform="translate(146,44)">
      <circle r="22" fill="#ffe060" opacity=".25"/>
      <circle r="14" fill="url(#cr-burst)"/>
      <path d="M0 -22 L4 -8 L22 0 L4 8 L0 22 L-4 8 L-22 0 L-4 -8 Z" fill="#ffe060" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 -14 L2 -5 L14 0 L2 5 L0 14 L-2 5 L-14 0 L-2 -5 Z" fill="#fff8c0" stroke="#0a0a0a" stroke-width=".8"/>
    </g>
    <!-- 放射线 -->
    <path d="M146 44 L166 24 M146 44 L174 48 M146 44 L162 68 M146 44 L122 20 M146 44 L114 58" stroke="#e8a020" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
    <!-- 起点 -->
    <circle cx="32" cy="158" r="4" fill="#1e6028" stroke="#0a0a0a" stroke-width="1.6"/>
    <!-- 抛物线飞行点 -->
    <circle cx="82" cy="130" r="3" fill="#5ac468" stroke="#0a0a0a" stroke-width="1.2"/>
    <circle cx="112" cy="100" r="3" fill="#5ac468" stroke="#0a0a0a" stroke-width="1.2"/>
  </g>
