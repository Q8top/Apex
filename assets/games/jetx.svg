<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="jx-bg" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f4f6"/></radialGradient>
    <linearGradient id="jx-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d8b4ff"/><stop offset="50%" stop-color="#a05ee0"/><stop offset="100%" stop-color="#4a1e70"/></linearGradient>
    <linearGradient id="jx-purple2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8c8ff"/><stop offset="100%" stop-color="#7038b0"/></linearGradient>
    <radialGradient id="jx-flame" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#fffbe0"/><stop offset="40%" stop-color="#ffb040"/><stop offset="100%" stop-color="#a02808"/></radialGradient>
    <radialGradient id="jx-flame2" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff8c0"/><stop offset="60%" stop-color="#ff6a20"/><stop offset="100%" stop-color="#7a1808"/></radialGradient>
  </defs>
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#jx-bg)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(160,94,224,.35)" stroke-width="1"/>
  <g transform="translate(100,100) scale(0.82) translate(-100,-100)">
    <!-- 星空点 -->
    <circle cx="54" cy="58" r="1.2" fill="#a05ee0" opacity=".55"/>
    <circle cx="160" cy="70" r="1.5" fill="#a05ee0" opacity=".7"/>
    <circle cx="46" cy="98" r="1" fill="#a05ee0" opacity=".45"/>
    <circle cx="170" cy="112" r="1.3" fill="#a05ee0" opacity=".55"/>
    <circle cx="66" cy="150" r="1.2" fill="#a05ee0" opacity=".5"/>
    <circle cx="152" cy="152" r="1.4" fill="#a05ee0" opacity=".6"/>
    <!-- 尾焰（在机身后方） -->
    <path d="M88 122 L76 156 L92 142 L100 160 L108 142 L124 156 L112 122 Z" fill="url(#jx-flame)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round" opacity=".95"/>
    <path d="M96 124 L92 146 L100 140 L108 146 L104 124 Z" fill="url(#jx-flame2)" opacity=".9"/>
    <!-- 喷气机机身（斜向上） -->
    <!-- 主翼（右下三角） -->
    <path d="M92 82 L44 118 L56 120 L98 106 Z" fill="url(#jx-purple2)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
    <!-- 机身 -->
    <path d="M78 88 L130 74 L156 62 L144 76 L100 106 Z" fill="url(#jx-purple)" stroke="#0a0a0a" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- 尾翼 -->
    <path d="M74 90 L64 76 L78 82 Z" fill="url(#jx-purple2)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 机头尖 -->
    <path d="M142 76 L162 60 L156 68 L148 78 Z" fill="url(#jx-purple2)" stroke="#0a0a0a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 驾驶舱 -->
    <path d="M116 78 Q122 76 128 76 L122 84 Q118 82 116 78 Z" fill="#fff" stroke="#0a0a0a" stroke-width="1.2" opacity=".92"/>
    <!-- 机身高光 -->
    <path d="M84 92 L136 72" stroke="#fff" stroke-width="1.4" opacity=".55" stroke-linecap="round"/>
    <!-- 尾翼小旗 -->
    <circle cx="152" cy="68" r="1.6" fill="#ffe060" stroke="#0a0a0a" stroke-width=".8"/>
  </g>
</svg>
