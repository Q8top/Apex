<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="av-bg" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f4f6"/></radialGradient>
    <linearGradient id="av-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff9a9d"/><stop offset="50%" stop-color="#e5484d"/><stop offset="100%" stop-color="#8a1a1e"/></linearGradient>
    <linearGradient id="av-red2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffb8b8"/><stop offset="100%" stop-color="#b02830"/></linearGradient>
    <radialGradient id="av-cloud" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e0e0e6"/></radialGradient>
  </defs>
  <rect x="30" y="30" width="140" height="140" rx="30" fill="url(#av-bg)"/>
  <rect x="30.5" y="30.5" width="139" height="139" rx="29.5" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="36" y="36" width="128" height="128" rx="24" fill="none" stroke="rgba(229,72,77,.35)" stroke-width="1"/>
  <g transform="translate(100,100) scale(0.82) translate(-100,-100)">
    <!-- 云朵（背景） -->
    <ellipse cx="60" cy="120" rx="20" ry="10" fill="url(#av-cloud)" opacity=".85"/>
    <ellipse cx="72" cy="118" rx="14" ry="9" fill="url(#av-cloud)" opacity=".85"/>
    <ellipse cx="50" cy="122" rx="12" ry="8" fill="url(#av-cloud)" opacity=".7"/>
    <ellipse cx="148" cy="148" rx="22" ry="11" fill="url(#av-cloud)" opacity=".85"/>
    <ellipse cx="136" cy="150" rx="14" ry="9" fill="url(#av-cloud)" opacity=".85"/>
    <!-- 尾迹弧线 -->
    <path d="M30 160 Q60 150 90 130 Q115 115 130 95" stroke="#e5484d" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".45" stroke-dasharray="3 4"/>
    <!-- 飞机主体（俯视） -->
    <!-- 机翼 -->
    <path d="M96 92 L40 118 L46 122 L96 108 Z" fill="url(#av-red)" stroke="#0a0a0a" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M104 92 L160 118 L154 122 L104 108 Z" fill="url(#av-red)" stroke="#0a0a0a" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 机身 -->
    <ellipse cx="100" cy="98" rx="11" ry="36" fill="url(#av-red2)" stroke="#0a0a0a" stroke-width="2.4"/>
    <!-- 机头 -->
    <path d="M100 58 Q106 66 104 74 L96 74 Q94 66 100 58 Z" fill="url(#av-red2)" stroke="#0a0a0a" stroke-width="2"/>
    <!-- 尾翼 -->
    <path d="M92 130 L82 142 L118 142 L108 130 Z" fill="url(#av-red)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
    <!-- 驾驶舱窗 -->
    <ellipse cx="100" cy="72" rx="4" ry="5" fill="#fff" stroke="#0a0a0a" stroke-width="1.4" opacity=".95"/>
    <!-- 舷窗 -->
    <circle cx="100" cy="90" r="1.6" fill="#fff" stroke="#0a0a0a" stroke-width=".8"/>
    <circle cx="100" cy="98" r="1.6" fill="#fff" stroke="#0a0a0a" stroke-width=".8"/>
    <circle cx="100" cy="106" r="1.6" fill="#fff" stroke="#0a0a0a" stroke-width=".8"/>
    <!-- 高光 -->
    <ellipse cx="96" cy="80" rx="2" ry="8" fill="#fff" opacity=".45"/>
  </g>
</svg>
