<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>一千零一夜 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<link rel="stylesheet" href="/src/css/lines.css">
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
</head>
<body data-game="arabian-nights" data-theme="arabian">
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<div id="app">
  <header class="lm-bar">
    <a class="lm-icon-btn" href="/game.html?id=arabian-nights" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="lm-brand">一千零一夜</div>
    <div class="lm-bar-right">
      <button class="lm-icon-btn" id="lm-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="lm-icon-btn" id="lm-menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <section class="lm-stage">
    <div class="lm-freespin-banner" id="lm-fs-banner" hidden>
      <span>★ 免费旋转</span>
      <span class="lm-fs-count" id="lm-fs-count">0</span>
    </div>
    <div class="lm-grid" id="lm-grid" aria-label="游戏网格"></div>
  </section>

  <section class="lm-win-row">
    <div class="lm-win-label" id="lm-win-label">本局中奖</div>
    <div class="lm-win-value" id="lm-win-value">¥0.00</div>
    <div class="lm-combo" id="lm-combo"></div>
  </section>

  <button class="lm-mode-action-btn" type="button" id="lm-mode-action">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
    <span>重置余额</span>
  </button>

  <section class="lm-stats">
    <div class="lm-stat"><span class="lm-stat-label">余额</span><span class="lm-stat-value" id="lm-balance">¥1,000.00</span></div>
    <div class="lm-stat"><span class="lm-stat-label">下注</span><span class="lm-stat-value" id="lm-bet">¥10.00</span></div>
    <div class="lm-stat"><span class="lm-stat-label">赢得</span><span class="lm-stat-value" id="lm-won">¥0</span></div>
  </section>

  <section class="lm-bet-row">
    <button class="lm-bet-btn" id="lm-bet-minus" aria-label="减">−</button>
    <div class="lm-bet-txt" id="lm-bet-txt">下注 ¥10.00</div>
    <button class="lm-bet-btn" id="lm-bet-plus" aria-label="加">+</button>
  </section>

  <section class="lm-spin-row">
    <button class="lm-spin-btn" id="lm-spin">
      <svg class="lm-spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.51-7.13"/><path d="M21 3v6h-6"/></svg>
      <span>旋转</span>
    </button>
  </section>

  <section class="lm-foot">
    <button class="lm-foot-btn" id="lm-auto">
      <svg class="lm-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      <span>自动</span>
    </button>
    <button class="lm-foot-btn" id="lm-history">
      <svg class="lm-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>记录</span>
    </button>
    <button class="lm-foot-btn" id="lm-paytable">
      <svg class="lm-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
      <span>赔付</span>
    </button>
  </section>

  <div class="lm-modal" id="lm-modal" aria-hidden="true">
    <div class="lm-modal-mask"></div>
    <div class="lm-modal-box">
      <div class="lm-modal-head">
        <div class="lm-modal-title" id="lm-modal-title">标题</div>
        <button class="lm-modal-x" id="lm-modal-x" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="lm-modal-body" id="lm-modal-body"></div>
    </div>
  </div>

  <div class="lm-fs-summary" id="lm-fs-summary">
    <div class="lm-fs-summary-glow"></div>
    <div class="lm-fs-summary-content">
      <div class="lm-fs-summary-title">免费旋转总赢分</div>
      <div class="lm-fs-summary-amount" id="lm-fs-total">¥0</div>
    </div>
  </div>

  <div class="lm-toast" id="lm-toast"></div>
</div>

<script src="/src/js/games/lines-engine.js"></script>
<script src="/src/js/games/lines-audio.js"></script>
<script src="/src/js/games/arabian-nights/config.js"></script>
<script src="/src/js/games/arabian-nights/symbols.js"></script>
<script src="/src/js/inline/bigwin.js"></script>
<script src="/src/js/games/lines-ui.js"></script>
<script src="/src/js/inline/apex-loader.js"></script>
</body>
</html>
