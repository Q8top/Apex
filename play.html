<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>奥林匹斯之门 · 试玩</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/src/css/play.css">
</head>
<body>

<main class="gp-page" data-game-id="olympus">
  <header class="gp-topbar">
    <button class="gp-icon-btn" id="gpBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 L9 12 L15 6"/></svg>
    </button>

    <div class="gp-title-wrap">
      <h1 class="gp-title" id="gpTitle">奥林匹斯之门</h1>
      <span class="gp-mode" id="gpMode">试玩模式</span>
    </div>

    <div class="gp-actions">
      <button class="gp-icon-btn" id="gpSound" type="button" aria-label="音效" aria-pressed="true">
        <svg class="gp-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 L6 9 L2 9 L2 15 L6 15 L11 19 Z"/>
          <path d="M15.5 8.5 Q18 12 15.5 15.5"/>
          <path d="M18.5 5.5 Q23 12 18.5 18.5"/>
        </svg>
        <svg class="gp-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 L6 9 L2 9 L2 15 L6 15 L11 19 Z"/>
          <line x1="16" y1="9" x2="22" y2="15"/>
          <line x1="22" y1="9" x2="16" y2="15"/>
        </svg>
      </button>
      <button class="gp-icon-btn" id="gpMenu" type="button" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </header>

  <section class="gp-stage">
    <div class="gp-board" id="gpBoard" aria-label="游戏盘面"></div>
  </section>

  <div class="gp-result" id="gpResult" aria-live="polite"></div>
<div class="gp-fs-banner" id="gpFsBanner" hidden>
    <span class="gp-fs-flash">⚡</span>
    <span>FREE SPINS · 剩余</span>
    <strong id="gpFsCount">15</strong>
    <span>次</span>
  </div>

    <section class="gp-panel">
    <div class="gp-prize">
      <div class="gp-prize-label">本局中奖</div>
      <div class="gp-prize-value" id="gpPrize">¥0.00</div>
    </div>

    <button class="gp-btn gp-btn-soft" id="gpRecharge" type="button">重置余额</button>

    <div class="gp-stats">
      <div class="gp-stat">
        <span class="gp-stat-k">余额</span>
        <strong class="gp-stat-v" id="gpBalance">¥10,000.00</strong>
      </div>
      <div class="gp-stat">
        <span class="gp-stat-k">下注</span>
        <strong class="gp-stat-v" id="gpBet">¥10.00</strong>
      </div>
      <div class="gp-stat">
        <span class="gp-stat-k">赢得</span>
        <strong class="gp-stat-v" id="gpWin">¥0.00</strong>
      </div>
    </div>

    <div class="gp-bet-row">
      <button class="gp-bet-btn" id="gpBetMinus" type="button" aria-label="减少下注">−</button>
      <div class="gp-bet-value" id="gpBetValue">下注 ¥10.00</div>
      <button class="gp-bet-btn" id="gpBetPlus" type="button" aria-label="增加下注">+</button>
    </div>

    <button class="gp-btn gp-btn-primary" id="gpSpin" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12 a9 9 0 1 1 -3 -6.7"/>
        <polyline points="21 4 21 9 16 9"/>
      </svg>
      <span>旋转</span>
    </button>

    <div class="gp-tools">
      <button class="gp-tool" id="gpAuto" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11 V9 a4 4 0 0 1 4 -4 h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13 v2 a4 4 0 0 1 -4 4 H3"/></svg>
        <span>自动</span>
      </button>
      <button class="gp-tool" id="gpHistory" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>记录</span>
      </button>
      <button class="gp-tool" id="gpPaytable" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <span>赔付</span>
      </button>
    </div>
  </section>
</main>

<div class="gp-tutorial" id="gpTutorial" hidden>
  <div class="gp-tut-mask" id="gpTutMask"></div>
  <div class="gp-tut-card" id="gpTutCard">
    <div class="gp-tut-step" id="gpTutStep">1 / 3</div>
    <h3 class="gp-tut-title" id="gpTutTitle"></h3>
    <p class="gp-tut-desc" id="gpTutDesc"></p>
    <div class="gp-tut-actions">
      <button type="button" class="gp-tut-skip" id="gpTutSkip">跳过</button>
      <button type="button" class="gp-tut-next" id="gpTutNext">下一步</button>
    </div>
  </div>
</div>

<div class="gp-flash" id="gpFlash" aria-hidden="true"></div>


<div class="gp-settle" id="gpSettle" hidden aria-hidden="true">
  <div class="gp-settle-card" role="status">
    <div class="gp-settle-chain" id="gpSettleChain"></div>
    <div class="gp-settle-label">本局总赢</div>
    <div class="gp-settle-win" id="gpSettleWin">¥0.00</div>
    <div class="gp-settle-mult" id="gpSettleMult" hidden></div>
  </div>
</div>


<div class="gp-sheet" id="gpSheet" hidden aria-hidden="true">
  <div class="gp-sheet-backdrop" id="gpSheetBackdrop"></div>
  <div class="gp-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="gpSheetTitle">
    <div class="gp-sheet-handle" aria-hidden="true"></div>
    <h2 class="gp-sheet-title" id="gpSheetTitle"></h2>
    <div class="gp-sheet-body" id="gpSheetBody"></div>
  </div>
</div>


<div class="gp-toast" id="gpToast" role="status" aria-live="polite"></div>

<script src="/src/js/games/audio.js" defer></script>
<script src="/src/js/games/olympus-symbols.js" defer></script>
<script src="/src/js/play.js" defer></script>
</body>
</html>
