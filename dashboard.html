<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ApexTop | 正在开发中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { height: 100vh; display: flex; flex-direction: column; background: #09090b; color: #fff; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.6; max-width: 300px; margin-bottom: 40px; }
    .btn-logout { padding: 12px 30px; border-radius: 99px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 14px; cursor: pointer; transition: 0.2s; text-decoration: none; }
    .btn-logout:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="icon">🚧</div>
  <h1>全新赛道开发中</h1>
  <p>我们正在全力打造集 AI 工具、垂直 SaaS 与 B2B 平台于一体的全新生态系统，敬请期待...</p>
  
  <button class="btn-logout" onclick="logout()">退出登录</button>

  <script>
    async function logout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch(e) {}
      // 无论成功失败，清空状态回首页
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = '/index.html'; 
    }
  </script>
</body>
</html>
