<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Games</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/src/css/tokens.css?v=1">
<link rel="stylesheet" href="/src/css/base.css?v=1">
<style>
body{margin:0;background:#0d0d14;color:#fff;font-family:system-ui,-apple-system,sans-serif;}
.ggr-head{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1c1c2a;}
.ggr-head h1{font-size:18px;margin:0;flex:1;}
.ggr-head a{color:#9bb;text-decoration:none;font-size:14px;}
.ggr-note{margin:12px 18px;padding:10px 12px;background:#1c1c2a;border-radius:8px;font-size:12px;color:#9bb;}
.ggr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 18px 32px;}
.ggr-card{background:#15151f;border:1px solid #232336;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.ggr-card:active{transform:scale(.97);}
.ggr-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0a0a12;}
.ggr-card .t{padding:10px 12px;font-size:14px;line-height:1.3;}
.ggr-card .p{color:#889;font-size:11px;margin-top:2px;}
.ggr-empty{padding:60px 18px;text-align:center;color:#889;}
.ggr-loader{padding:40px;text-align:center;color:#889;}
.ggr-toast{position:fixed;left:16px;right:16px;bottom:24px;padding:12px 16px;background:#2a2a3a;border-radius:10px;font-size:13px;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;z-index:100;}
.ggr-toast.show{display:block;}
.ggr-iframe-wrap{position:fixed;inset:0;background:#000;z-index:200;display:none;}
.ggr-iframe-wrap.show{display:block;}
.ggr-iframe-wrap iframe{width:100%;height:100%;border:0;display:block;}
.ggr-close{position:fixed;top:10px;right:10px;z-index:210;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:20px;cursor:pointer;display:none;}
.ggr-close.show{display:block;}
</style>
</head>
<body>
<header class="ggr-head">
  <a href="/">← 返回</a>
  <h1>Apex Games</h1>
</header>
<div id="ggr-note" class="ggr-note" hidden></div>
<div id="ggr-loader" class="ggr-loader">加载中…</div>
<div id="ggr-grid" class="ggr-grid" hidden></div>
<div id="ggr-empty" class="ggr-empty" hidden>没有可用的游戏。</div>
<div id="ggr-toast" class="ggr-toast"></div>
<button id="ggr-close" class="ggr-close" aria-label="关闭">✕</button>
<div id="ggr-iframe-wrap" class="ggr-iframe-wrap">
  <iframe id="ggr-iframe" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
</div>
<script defer src="/src/js/ggr/lobby.js?v=1"></script>
</body>
</html>
