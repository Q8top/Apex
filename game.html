<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>游戏详情 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/game.css">
</head>
<body>
<header class="gm-topbar">
  <a class="gm-back" href="javascript:history.back()" aria-label="返回">
    <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
  </a>
  <h1 class="gm-title" id="gm-top-title">游戏</h1>
  <button class="gm-more" type="button" aria-label="更多" id="gm-more">
    <i class="ri-more-fill" aria-hidden="true"></i>
  </button>
</header>

<main class="gm-main">
  <section class="gm-carousel" id="gm-carousel">
    <div class="gm-carousel-track" id="gm-carousel-track"></div>
    <div class="gm-carousel-dots" id="gm-carousel-dots" role="tablist"></div>
  </section>

  <section class="gm-hero-title">
    <h2 class="gm-hero-name" id="gm-name">游戏名称</h2>
    <p class="gm-hero-sub" id="gm-sub">副标题</p>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏介绍</h3>
    <p class="gm-intro" id="gm-intro"></p>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏规则</h3>
    <ol class="gm-rules" id="gm-rules"></ol>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">中奖说明</h3>
    <div class="gm-prizes" id="gm-prizes"></div>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">赔付表</h3>
    <table class="gm-paytable">
      <thead><tr><th>中奖组合</th><th>奖励倍数</th></tr></thead>
      <tbody id="gm-paytable"></tbody>
    </table>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏信息</h3>
    <dl class="gm-info" id="gm-info"></dl>
  </section>

  <div class="gm-bottom-space"></div>
</main>

<footer class="gm-actionbar">
  <div class="gm-tools">
    <button type="button" class="gm-tool" id="gm-fav">
      <i class="ri-star-line" aria-hidden="true"></i>
      <span>收藏</span>
    </button>
    <button type="button" class="gm-tool" id="gm-support">
      <i class="ri-customer-service-2-line" aria-hidden="true"></i>
      <span>在线客服</span>
    </button>
    <button type="button" class="gm-tool gm-tool-textonly" id="gm-demo">
      <span>免费试玩</span>
    </button>
    <button type="button" class="gm-start" id="gm-start">开始游戏</button>
  </div>
</footer>

<script src="/src/js/inline/game.js"></script>
</body>
</html>
