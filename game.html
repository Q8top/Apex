<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>游戏详情 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/game.css">
  <style>html,body,*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}</style>
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
<link rel="stylesheet" href="/src/css/apex-skeleton.css">
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<header class="gm-topbar">
  <button class="gm-back" type="button" id="gm-back" aria-label="返回"><i class="ri-arrow-left-s-line" aria-hidden="true"></i></button>
  <h1 class="gm-title" id="gm-top-title">游戏</h1>
  <button class="gm-more" type="button" aria-label="更多" id="gm-more">
    <i class="ri-more-fill" aria-hidden="true"></i>
  </button>
</header>

<main class="gm-main">
  <section class="gm-carousel" id="gm-carousel">
    <div class="gm-carousel-track" id="gm-carousel-track"></div>
    <div class="gm-carousel-dots" id="gm-carousel-dots" role="tablist"></div>
  </section>

  <section class="gm-hero-title">
    <h2 class="gm-hero-name" id="gm-name">游戏名称</h2>
    <p class="gm-hero-sub" id="gm-sub">副标题</p>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏介绍</h3>
    <p class="gm-intro" id="gm-intro"></p>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏规则</h3>
    <ol class="gm-rules" id="gm-rules"></ol>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">中奖说明</h3>
    <div class="gm-prizes" id="gm-prizes"></div>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">赔付表</h3>
    <table class="gm-paytable">
      <thead><tr><th>中奖组合</th><th>奖励倍数</th></tr></thead>
      <tbody id="gm-paytable"></tbody>
    </table>
  </section>

  <section class="gm-block">
    <h3 class="gm-block-title">游戏信息</h3>
    <dl class="gm-info" id="gm-info"></dl>
  </section>

  <div class="gm-bottom-space"></div>
</main>

<footer class="gm-actionbar">
  <div class="gm-tools">
    <button type="button" class="gm-tool" id="gm-fav">
      <i class="ri-star-line" aria-hidden="true"></i>
      <span>收藏</span>
    </button>
    <button type="button" class="gm-tool" id="gm-support">
      <i class="ri-customer-service-2-line" aria-hidden="true"></i>
      <span>在线客服</span>
    </button>
    <button type="button" class="gm-tool gm-tool-textonly" id="gm-demo">
      <span>免费试玩</span>
    </button>
    <button type="button" class="gm-start" id="gm-start">开始游戏</button>
  </div>
</footer>

<script src="/src/js/slot/slot-symbols.js"></script>
<script src="/src/js/sweet/sweet-symbols.js"></script>
<script src="/src/js/olympus/olympus-symbols.js"></script>
<script src="/src/js/sugar/sugar-symbols.js"></script>
<script src="/src/js/starlight/starlight-symbols.js"></script>
<script src="/src/js/bigbass/bigbass-symbols.js"></script>
<script src="/src/js/games/1001-mg/symbols.js"></script>
<script src="/src/js/games/1001-mg2/symbols.js"></script>
<script src="/src/js/games/10001-nights/symbols.js"></script>
<script src="/src/js/games/10001-mega/symbols.js"></script>
<script src="/src/js/games/1429-seas/symbols.js"></script>
<script src="/src/js/games/5-lions/symbols.js"></script>
<script src="/src/js/games/5-lions-gold/symbols.js"></script>
<script src="/src/js/games/5-lions-mega/symbols.js"></script>
<script src="/src/js/games/arabian-nights/symbols.js"></script>
<script src="/src/js/games/asgardian/symbols.js"></script>
<script src="/src/js/games/aces-eights/symbols.js"></script>
<script src="/src/js/games/fengshui/symbols.js"></script>
<script src="/src/js/inline/game.js"></script>
<script src="/src/js/inline/apex-loader.js"></script>
<script src="/src/js/inline/apex-page-transition.js"></script>
<script src="/src/js/inline/apex-prefetch.js"></script>
</body>
</html>
