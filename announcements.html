<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>公告 · Apex Global Entertainment</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/announcements.css?v=202610011614">
<style>
  html.ann-auth-hint body { visibility: hidden; }
</style>
<script>
  (function(){try{if(localStorage.getItem('apex_auth_hint')==='1'){document.documentElement.style.visibility='hidden';}
  }catch(e){}
  window.addEventListener('pageshow',function(e){
    try{if(localStorage.getItem('apex_auth_hint')==='1'){document.documentElement.style.visibility='hidden';}
    else{document.documentElement.style.visibility='';}
    }catch(x){}
  });
  </script>
  <style>html,body,*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}</style>
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<header class="ann-topbar">
  <a class="ann-back" href="/" aria-label="返回首页">
    <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
  </a>
  <h1 class="ann-title">公告</h1>
  <span class="ann-topbar-spacer" aria-hidden="true"></span>
</header>
<main class="ann-main">
  <ul class="ann-list" id="ann-list"></ul>
  <div class="ann-empty" id="ann-empty" hidden>
    <i class="ri-inbox-archive-line" aria-hidden="true"></i>
    <p>暂无公告</p>
  </div>
</main>
<script src="/src/js/inline/announcements.js?v=202610011614"></script>
<script src="/src/js/inline/apex-loader.js"></script>
<script src="/src/js/inline/apex-page-transition.js"></script>
</body>
</html>
