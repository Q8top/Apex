<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>页面不存在 · Apex Global Entertainment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .container { max-width: 480px; width: 100%; }
  .code {
    font-family: 'Manrope', monospace;
    font-size: 72px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 12px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #ffffff;
  }
  .desc {
    font-size: 14px;
    color: #8a8a8a;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 32px;
  }
  .btn {
    display: block;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s;
    min-height: 48px;
    line-height: 20px;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
    color: #050505;
    box-shadow: 0 4px 14px rgba(212,175,55,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(212,175,55,0.5);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.03);
    color: #d4af37;
    border: 1px solid rgba(212,175,55,0.3);
  }
  .btn-secondary:hover {
    background: rgba(212,175,55,0.08);
    border-color: rgba(212,175,55,0.6);
  }
  .links {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 12px;
    color: #555;
  }
  .links a {
    color: #8a8a8a;
    text-decoration: none;
  }
  .links a:hover { color: #d4af37; }
</style>
  <style>html,body,*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}</style>
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<div class="container">
  <div class="code">404</div>
  <div class="title">找不到这个页面</div>
  <div class="desc">你访问的页面不存在，或者已经被移走了。<br>试试回到首页重新开始。</div>
  <div class="actions">
    <a href="/" class="btn btn-primary">返回首页</a>
    <a href="/status" class="btn btn-secondary">查看系统状态</a>
  </div>
  <div class="links">
    <a href="/privacy">隐私政策</a>
    <a href="/terms">用户协议</a>
    <a href="/status">系统状态</a>
  </div>
</div>
<script src="/src/js/inline/apex-loader.js"></script>
<script src="/src/js/inline/apex-page-transition.js"></script>
</body>
</html>
