<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="robots" content="noindex,nofollow">
  <title>Apex</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <link rel="stylesheet" href="/src/css/home.css?v=20260930d">
</head>
<body>

<main class="app">

  <section class="welcome-card" aria-label="欢迎卡片">

    <header class="wc-head">
      <button class="lang-btn" id="lang-btn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-label="切换语言">
        <span class="lang-flag" id="lang-flag">🇨🇳</span>
        <span class="lang-label" id="lang-label">中文</span>
        <i class="ri-arrow-down-s-line" aria-hidden="true"></i>
      </button>
    </header>

    <ul class="lang-menu" id="lang-menu" role="listbox" aria-label="语言列表" hidden>
      <li role="option" data-lang="zh" aria-selected="true"><span>🇨🇳</span><span>中文</span></li>
      <li role="option" data-lang="en"><span>🇺🇸</span><span>English</span></li>
      <li role="option" data-lang="es"><span>🇪🇸</span><span>Español</span></li>
      <li role="option" data-lang="pt"><span>🇵🇹</span><span>Português</span></li>
      <li role="option" data-lang="fr"><span>🇫🇷</span><span>Français</span></li>
    </ul>

    <a class="profile-block" id="profile-block" href="#" role="button"
       data-apex-action="profile" aria-label="查看个人资料">
      <span class="profile-avatar" aria-hidden="true">
        <i class="ri-user-3-fill"></i>
        <span class="profile-status"></span>
      </span>
      <span class="profile-meta">
        <span class="profile-name" id="profile-name">用户</span>
        <span class="profile-id" id="profile-id">ID: --</span>
      </span>
      <span class="profile-arrow" aria-hidden="true">
        <i class="ri-arrow-right-s-line"></i>
      </span>
    </a>

    <div class="quick-actions">
      <button class="qa-item" type="button" data-apex-action="support">
        <span class="qa-icon qa-blue" aria-hidden="true">
          <i class="ri-customer-service-2-line"></i>
        </span>
        <span class="qa-label">在线客服</span>
      </button>

      <button class="qa-item" type="button" data-apex-action="notify">
        <span class="qa-icon qa-gold" aria-hidden="true">
          <i class="ri-notification-3-line"></i>
          <span class="qa-badge">3</span>
        </span>
        <span class="qa-label">通知</span>
      </button>

      <button class="qa-item" type="button" data-apex-action="settings">
        <span class="qa-icon qa-dark" aria-hidden="true">
          <i class="ri-settings-3-line"></i>
        </span>
        <span class="qa-label">设置</span>
      </button>
    </div>

  </section>

  <button class="btn-logout" id="btn-logout" type="button" data-apex-action="logout">
    <i class="ri-logout-box-r-line" aria-hidden="true"></i>
    <span>退出登录</span>
  </button>

</main>

<script src="/src/js/apiClient.js?v=20260930d"></script>
<script src="/src/js/home.js?v=20260930d"></script>
</body>
</html>
