<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Emberfall Dynasty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #171019; touch-action: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn {
      background: rgba(0,0,0,0.6); border: 1px solid #D9A441;
      color: #FFE7A0; padding: 10px 20px; border-radius: 20px;
      font-size: 16px; font-weight: bold; text-decoration: none;
      text-align: center;
    }
    #err {
      display: none; position: fixed; inset: 20px; background: rgba(200,0,0,0.9);
      color: white; padding: 20px; z-index: 999; font-family: monospace;
      border-radius: 10px; overflow: auto;
    }
  </style>
</head>
<body>
  <div id="ui">
    <a href="/" class="btn">← 返回首页</a>
    <div class="btn" style="background:#791F28; color:white;">积分: <span id="score">10000</span></div>
  </div>
  <canvas id="game"></canvas>
  <div id="err"></div>

  <script>
    window.onerror = function(msg, url, line) {
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.innerHTML += '<b>Error:</b> ' + msg + '<br>Line: ' + line + '<br><br>';
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // 符号列表
    const SYMS = ['dragon', 'seal', 'wild', 'phoenix', 'lotus', 'crown', 'feather', 'bell', 'ingot', 'coin', 'jade'];
    const IMGS = {};
    let loadedCount = 0;

    // 加载图片 (带了错误兜底)
    function loadImages() {
      IMGS.bg = new Image();
      IMGS.bg.src = '/assets/emberfall/bg.webp';
      
      SYMS.forEach(s => {
        IMGS[s] = new Image();
        IMGS[s].src = `/assets/emberfall/${s}.webp`;
        IMGS[s].onload = () => { loadedCount++; };
        IMGS[s].onerror = () => { console.log('fail load: ' + s); loadedCount++; };
      });
    }
    loadImages();

    // 游戏状态
    let score = 10000;
    const scoreEl = document.getElementById('score');
    const ROWS = 3, COLS = 5;
    let grid = [];
    let spinning = false;
    let offsets = Array(COLS).fill(0);

    // 随机
    function getRandomSym() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return SYMS[buf[0] % SYMS.length];
    }

    // 初始化盘面
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) grid[r][c] = getRandomSym();
    }

    // 绘制函数
    function draw() {
      ctx.fillStyle = '#171019';
      ctx.fillRect(0, 0, W, H);

      if (IMGS.bg && IMGS.bg.complete) {
        // 背景图铺满
        ctx.drawImage(IMGS.bg, 0, 0, W, H);
        // 黑色遮罩让画面变暗
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
      }

      // 计算网格位置
      const cellW = Math.min(W / 6.5, H / 8);
      const cellH = cellW;
      const startX = (W - cellW * COLS) / 2;
      const startY = (H - cellH * ROWS) / 2;

      // 绘制外框
      ctx.strokeStyle = '#D9A441';
      ctx.lineWidth = 4;
      ctx.strokeRect(startX - 10, startY - 10, cellW * COLS + 20, cellH * ROWS + 20);

      // 绘制符号
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          const x = startX + c * cellW;
          const y = startY + r * cellH + offsets[c];
          const sym = grid[r][c];
          
          if (IMGS[sym] && IMGS[sym].complete) {
            ctx.drawImage(IMGS[sym], x + 5, y + 5, cellW - 10, cellH - 10);
          } else {
            // 图片没加载出来时的占位框
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 5, y + 5, cellW - 10, cellH - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText(sym, x + 20, y + 40);
          }
        }
      }
    }

    // 旋转逻辑
    function spin() {
      if (spinning) return;
      if (score < 100) { alert('积分不足'); return; }
      
      spinning = true;
      score -= 100;
      scoreEl.innerText = score;
      
      let speed = 0;
      const spinInterval = setInterval(() => {
        speed += 0.5;
        for (let c = 0; c < COLS; c++) {
          offsets[c] += speed; // 列向下移动
          if (offsets[c] > 60) {
            offsets[c] -= 60;
            // 随机洗牌
            for (let r = 0; r < ROWS; r++) grid[r][c] = getRandomSym();
          }
        }
        draw();

        // 停止判定 (依次停止)
        if (speed > 20) {
          clearInterval(spinInterval);
          offsets.fill(0);
          spinning = false;
          
          // 简单的中奖判定
          let win = 0;
          for (let r = 0; r < ROWS; r++) {
            let first = grid[r][0];
            let match = true;
            for (let c = 1; c < COLS; c++) {
              if (grid[r][c] !== first) match = false;
            }
            if (match) win += 500;
          }
          
          if (win > 0) {
            setTimeout(() => {
              alert('中奖！获得 ' + win + ' 积分');
              score += win;
              scoreEl.innerText = score;
            }, 100);
          }
          draw();
        }
      }, 16);
    }

    // 主循环
    function loop() {
      if (!spinning) draw();
      requestAnimationFrame(loop);
    }
    loop();

    // 点击屏幕旋转
    canvas.addEventListener('pointerdown', spin);
  </script>
</body>
</html>
