<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171019">
  <title>Emberfall Dynasty</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #171019;
      overscroll-behavior: none; touch-action: none;
    }
    #game-root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; touch-action: none; }
    #home-btn {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      background: rgba(0,0,0,0.5); color: #ffd86a; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; text-decoration: none;
      border: 1px solid rgba(255,216,106,0.5);
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <a href="/" id="home-btn">← 返回首页</a>
  <main id="game-root"></main>
  
  <script src="/src/js/lib/phaser.min.js"></script>
  <script>
    const SYMBOLS = ['dragon', 'seal', 'wild', 'phoenix', 'lotus', 'crown', 'feather', 'bell', 'ingot', 'coin', 'jade'];
    const WEIGHTS = [2, 5, 3, 8, 10, 8, 15, 15, 20, 20, 20];

    function secureRandom() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] / 4294967296;
    }

    function getRandomSymbol() {
      const total = WEIGHTS.reduce((a, b) => a + b, 0);
      let r = secureRandom() * total;
      for (let i = 0; i < WEIGHTS.length; i++) {
        r -= WEIGHTS[i];
        if (r <= 0) return SYMBOLS[i];
      }
      return SYMBOLS[SYMBOLS.length - 1];
    }

    class BootScene extends Phaser.Scene {
      constructor() { super('BootScene'); }
      preload() {
        this.load.image('bg', '/assets/emberfall/bg.webp');
        SYMBOLS.forEach(sym => {
          this.load.image(sym, `/assets/emberfall/${sym}.webp`);
        });
      }
      create() {
        this.scene.start('GameScene');
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() { super('GameScene'); }
      create() {
        this.W = this.scale.width;
        this.H = this.scale.height;
        
        this.bg = this.add.image(this.W/2, this.H/2, 'bg');
        this.bg.setDisplaySize(this.W, this.H);

        this.balance = 10000;
        this.balanceText = this.add.text(this.W/2, this.H * 0.1, `积分: ${this.balance}`, {
          fontFamily: 'sans-serif', fontSize: '32px', color: '#FFE7A0', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.statusText = this.add.text(this.W/2, this.H * 0.85, '', {
          fontFamily: 'sans-serif', fontSize: '24px', color: '#FFF4DC'
        }).setOrigin(0.5);

        this.cols = 5;
        this.rows = 3;
        this.symbolSize = Math.min(this.W / 6, this.H / 8);
        this.gridW = this.cols * this.symbolSize;
        this.gridH = this.rows * this.symbolSize;
        this.startX = (this.W - this.gridW) / 2 + this.symbolSize / 2;
        this.startY = (this.H - this.gridH) / 2 + this.symbolSize / 2;

        this.add.rectangle(this.W/2, this.H/2, this.gridW + 20, this.gridH + 20, 0x171019, 0.8)
          .setStrokeStyle(4, 0xD9A441);

        this.gridSprites = [];
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const sym = getRandomSymbol();
            const x = this.startX + c * this.symbolSize;
            const y = this.startY + r * this.symbolSize;
            const sprite = this.add.image(x, y, sym);
            sprite.setDisplaySize(this.symbolSize * 0.85, this.symbolSize * 0.85);
            this.gridSprites.push(sprite);
          }
        }

        this.spinBtn = this.add.container(this.W/2, this.H * 0.92);
        const btnBg = this.add.circle(0, 0, 45, 0x791F28).setStrokeStyle(3, 0xD9A441);
        const btnText = this.add.text(0, 0, '旋转', {
          fontFamily: 'sans-serif', fontSize: '24px', color: '#FFF4DC', fontStyle: 'bold'
        }).setOrigin(0.5);
        this.spinBtn.add([btnBg, btnText]);
        this.spinBtn.setSize(90, 90).setInteractive({ useHandCursor: true });

        this.spinning = false;
        this.spinBtn.on('pointerdown', () => this.doSpin());
      }

      doSpin() {
        if (this.spinning) return;
        if (this.balance < 100) {
          this.statusText.setText('积分不足');
          return;
        }
        
        this.spinning = true;
        this.balance -= 100;
        this.updateBalance();
        this.statusText.setText('转动中...');

        let animationsDone = 0;
        this.gridSprites.forEach((sprite, index) => {
          const col = index % this.cols;
          const row = Math.floor(index / this.cols);
          const targetY = this.startY + row * this.symbolSize;
          
          sprite.y = targetY - this.symbolSize;

          this.tweens.add({
            targets: sprite,
            y: targetY,
            duration: 800 + col * 150,
            ease: 'Bounce.easeOut',
            onComplete: () => {
              sprite.setTexture(getRandomSymbol());
              sprite.setDisplaySize(this.symbolSize * 0.85, this.symbolSize * 0.85);
              animationsDone++;
              if (animationsDone === this.gridSprites.length) {
                this.finishSpin();
              }
            }
          });
        });
      }

      finishSpin() {
        this.spinning = false;
        let win = 0;
        const row1 = [this.gridSprites[5].texture.key, this.gridSprites[6].texture.key, this.gridSprites[7].texture.key];
        if (row1[0] === row1[1] && row1[1] === row1[2]) win += 500;
        
        const dragons = this.gridSprites.filter(s => s.texture.key === 'dragon').length;
        if (dragons >= 3) win += 1000;

        if (win > 0) {
          this.balance += win;
          this.updateBalance();
          this.statusText.setText(`中奖! 获得 ${win} 积分`);
          this.statusText.setColor('#FFE7A0');
          this.cameras.main.flash(500, 255, 200, 100);
        } else {
          this.statusText.setText('未中奖，再试一次');
          this.statusText.setColor('#FFF4DC');
        }
      }

      updateBalance() { this.balanceText.setText(`积分: ${this.balance}`); }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-root',
      backgroundColor: '#171019',
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      scene: [BootScene, GameScene]
    };
    
    new Phaser.Game(config);
  </script>
</body>
</html>
