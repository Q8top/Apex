<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>奥林匹斯</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/olympus.css?v=12">
</head>
<body class="ol-body">
<div class="ol-stage">
  <img class="ol-art" src="/assets/games/olympus-bg.jpeg" alt="" draggable="false">
  <div class="ol-grid" id="olGrid" aria-hidden="true"></div>
  <button class="ol-menu-btn" id="olMenu" aria-label="菜单">
    <i class="ri-menu-line" aria-hidden="true"></i>
  </button>
  <div class="ol-hud">
    <div class="ol-win-box">
      <span class="ol-win-label">赢得</span>
      <span class="ol-win-amount" id="olWin">¥0.00</span>
    </div>
    <div class="ol-info-row">
      <div class="ol-info-item">
        <i class="ri-wallet-3-line" aria-hidden="true"></i>
        <span class="ol-info-label">余额</span>
        <b class="ol-info-value" id="olBalance">¥0.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-coins-line" aria-hidden="true"></i>
        <span class="ol-info-label">下注</span>
        <b class="ol-info-value" id="olBet">¥1.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-trophy-line" aria-hidden="true"></i>
        <span class="ol-info-label">本局赢得</span>
        <b class="ol-info-value" id="olRoundWin">¥0.00</b>
      </div>
    </div>
    <div class="ol-action-cards">
      <button class="ol-action-card" id="olBuy">
        <span class="ol-action-title">购买 免费旋转</span>
        <span class="ol-action-price" id="olBuyPrice">¥100.00</span>
      </button>
      <button class="ol-action-card ol-action-card--toggle" id="olAnte">
        <span class="ol-action-title">赌注</span>
        <span class="ol-action-price" id="olAntePrice">¥1.25</span>
        <span class="ol-action-sub">胜率翻倍功能</span>
      </button>
    </div>
    <div class="ol-controls-row">
      <button class="ol-round-btn" id="olAuto" aria-label="自动旋转">
        <i class="ri-loop-right-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-bet-step" id="olBetMinus" aria-label="减小下注">
        <i class="ri-subtract-line" aria-hidden="true"></i>
      </button>
      <button class="ol-spin-btn" id="olSpin" aria-label="旋转">
        <i class="ri-refresh-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-bet-step" id="olBetPlus" aria-label="增大下注">
        <i class="ri-add-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-speed-btn" id="olSpeed" aria-label="极速模式">
        <span class="ol-speed-icons" id="olSpeedIcons">
          <i class="ri-flashlight-fill"></i>
        </span>
      </button>
    </div>
  </div>
</div>
<script src="/src/js/inline/olympus.js?v=2"></script>
</body>
</html>
