<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>奥林匹斯</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/olympus.css?v=26">
</head>
<body class="ol-body">
<div class="ol-stage">
  <img class="ol-art" src="/assets/games/olympus-bg.jpeg" alt="" draggable="false">
  <div class="ol-top-banner" aria-live="polite">
    <span class="ol-top-banner-amount" id="olTopAmount">¥0.00</span>
  </div>
  <div class="ol-grid" id="olGrid" aria-hidden="true"></div>
  <button class="ol-menu-btn" id="olMenu" aria-label="菜单">
    <i class="ri-menu-line" aria-hidden="true"></i>
  </button>
  <div class="ol-hud">
    <div class="ol-win-box">
      <span class="ol-win-label">赢得</span>
      <span class="ol-win-amount" id="olWin">¥0.00</span>
    </div>
    <div class="ol-info-row">
      <div class="ol-info-item">
        <i class="ri-wallet-3-line" aria-hidden="true"></i>
        <span class="ol-info-label">余额</span>
        <b class="ol-info-value" id="olBalance">¥0.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-coins-line" aria-hidden="true"></i>
        <span class="ol-info-label">下注</span>
        <b class="ol-info-value" id="olBet">¥1.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-trophy-line" aria-hidden="true"></i>
        <span class="ol-info-label">本局赢得</span>
        <b class="ol-info-value" id="olRoundWin">¥0.00</b>
      </div>
    </div>
    <div class="ol-action-cards">
      <button class="ol-action-card" id="olBuy">
        <span class="ol-action-title">购买 免费旋转</span>
        <span class="ol-action-price" id="olBuyPrice">¥100.00</span>
      </button>
      <button class="ol-action-card ol-action-card--toggle" id="olAnte">
        <span class="ol-action-title">赌注</span>
        <span class="ol-action-price" id="olAntePrice">¥1.25</span>
        <span class="ol-action-sub">胜率翻倍功能</span>
      </button>
    </div>
    <div class="ol-controls-row">
      <button class="ol-round-btn" id="olAuto" aria-label="自动旋转">
        <i class="ri-loop-right-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-bet-step" id="olBetMinus" aria-label="减小下注">
        <i class="ri-subtract-line" aria-hidden="true"></i>
      </button>
      <button class="ol-spin-btn" id="olSpin" aria-label="旋转">
        <i class="ri-refresh-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-bet-step" id="olBetPlus" aria-label="增大下注">
        <i class="ri-add-line" aria-hidden="true"></i>
      </button>
      <button class="ol-round-btn ol-speed-btn" id="olSpeed" aria-label="极速模式">
        <span class="ol-speed-icons" id="olSpeedIcons">
          <i class="ri-flashlight-fill"></i>
        </span>
      </button>
    </div>
  </div>
  <canvas class="ol-lightning" id="olLightning" aria-hidden="true"></canvas>
</div>
<script src="/src/games/olympus/config/symbols.js?v=1"></script>
<script src="/src/games/olympus/config/paytable.js?v=1"></script>
<script src="/src/games/olympus/config/reel-weights.js?v=1"></script>
<script src="/src/games/olympus/config/math-profile.js?v=1"></script>
<script src="/src/games/olympus/engine/matcher.js?v=1"></script>
<script src="/src/games/olympus/engine/reels.js?v=1"></script>
<script src="/src/games/olympus/engine/multiplier.js?v=2"></script>
<script src="/src/games/olympus/engine/tumble.js?v=1"></script>
<script src="/src/games/olympus/engine/round.js?v=2"></script>
<script src="/src/js/inline/olympus-audio.js?v=2"></script>
<script src="/src/js/inline/olympus-lightning.js?v=2"></script>
<script src="/src/js/inline/olympus-bigwin.js?v=1"></script>
  <div class="ol-bigwin" id="olBigWin" aria-live="polite">
    <div class="ol-bigwin-inner">
      <div class="ol-bigwin-text">BIG WIN</div>
      <div class="ol-bigwin-amount">¥0.00</div>
    </div>
  </div>
  <div class="ol-fs-intro" id="olFsIntro" aria-live="polite">
    <div class="ol-fs-intro-inner">
      <div class="ol-fs-intro-crown" aria-hidden="true">
        <svg viewBox="0 0 64 40" width="86" height="54">
          <path d="M4 36 L10 8 L20 22 L32 4 L44 22 L54 8 L60 36 Z" fill="url(#fsGold)"/>
          <defs><linearGradient id="fsGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff2b8"/>
            <stop offset="0.5" stop-color="#ffc93c"/>
            <stop offset="1" stop-color="#a06500"/>
          </linearGradient></defs>
        </svg>
      </div>
      <div class="ol-fs-intro-title">CONGRATULATIONS!</div>
      <div class="ol-fs-intro-sub">您已获得</div>
      <div class="ol-fs-intro-count"><span id="olFsCount">15</span></div>
      <div class="ol-fs-intro-label">FREE SPINS · 免费旋转</div>
      <div class="ol-fs-intro-hint">点击任意位置继续</div>
    </div>
  </div>
  <aside class="ol-fs-panel" id="olFsPanel" aria-live="polite">
    <div class="ol-fs-panel-title">TOTAL MULTIPLIER</div>
    <div class="ol-fs-panel-mult"><span id="olFsMult">1×</span></div>
    <div class="ol-fs-panel-sep"></div>
    <div class="ol-fs-panel-title">FREE SPINS LEFT</div>
    <div class="ol-fs-panel-count"><span id="olFsLeft">15</span></div>
    <div class="ol-fs-panel-sep"></div>
    <div class="ol-fs-panel-title">COLLECTED</div>
    <div class="ol-fs-panel-collected" id="olFsCollected"></div>
  </aside>
  <div class="ol-fs-summary" id="olFsSummary" aria-live="polite">
    <div class="ol-fs-summary-inner">
      <div class="ol-fs-summary-title">FREE SPINS 结束</div>
      <div class="ol-fs-summary-sub">您的免费旋转共赢得</div>
      <div class="ol-fs-summary-amount" id="olFsSummaryAmount">¥0.00</div>
      <div class="ol-fs-summary-hint">点击继续</div>
    </div>
  </div>
<script src="/src/js/inline/olympus-fs.js?v=5"></script>
<script src="/src/js/inline/olympus.js?v=21"></script>
</body>
</html>
