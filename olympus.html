<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>奥林匹斯之门 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<link rel="stylesheet" href="/src/css/olympus.css?v=202610021911">
</head>
<body>

<svg id="olympus-defs" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"></svg>

<div id="app">

  <header class="ol-bar">
    <a class="ol-icon-btn" href="/game.html?id=olympus" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="ol-brand">奥林匹斯之门</div>
    <div class="ol-bar-right">
      <button class="ol-icon-btn" id="ol-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="ol-icon-btn" id="ol-menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <section class="ol-stage">
    <div class="ol-grid" id="ol-grid" aria-label="游戏网格"></div>
  </section>

  <section class="ol-win-row">
    <div class="ol-win-label" id="ol-win-label">本局中奖</div>
    <div class="ol-win-value" id="ol-win-value">¥0.00</div>
    <div class="ol-combo" id="ol-combo"></div>
  </section>

  <button class="ol-action-btn" type="button" id="ol-mode-action">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
    <span>重置余额</span>
  </button>

  <section class="ol-stats">
    <div class="ol-stat"><span class="ol-stat-label">余额</span><span class="ol-stat-value" id="ol-balance">¥1,000.00</span></div>
    <div class="ol-stat"><span class="ol-stat-label">下注</span><span class="ol-stat-value" id="ol-bet">¥10.00</span></div>
    <div class="ol-stat"><span class="ol-stat-label">赢得</span><span class="ol-stat-value" id="ol-won">¥0</span></div>
  </section>

  <section class="ol-bet-row">
    <button class="ol-bet-btn" id="ol-bet-minus" aria-label="减">−</button>
    <div class="ol-bet-txt" id="ol-bet-txt">下注 ¥10.00</div>
    <button class="ol-bet-btn" id="ol-bet-plus" aria-label="加">+</button>
  </section>

  <section class="ol-spin-row">
    <button class="ol-spin-btn" id="ol-spin">
      <svg class="ol-spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.51-7.13"/><path d="M21 3v6h-6"/></svg>
      <span>旋转</span>
    </button>
  </section>

  <section class="ol-foot">
    <button class="ol-foot-btn" id="ol-auto">
      <svg class="ol-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      <span>自动</span>
    </button>
    <button class="ol-foot-btn" id="ol-history">
      <svg class="ol-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>记录</span>
    </button>
    <button class="ol-foot-btn" id="ol-paytable">
      <svg class="ol-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
      <span>赔付</span>
    </button>
  </section>

  <div class="ol-modal" id="ol-modal" aria-hidden="true">
    <div class="ol-modal-mask" data-close="1"></div>
    <div class="ol-modal-box">
      <div class="ol-modal-head">
        <div class="ol-modal-title" id="ol-modal-title">标题</div>
        <button class="ol-modal-x" id="ol-modal-x" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="ol-modal-body" id="ol-modal-body"></div>
    </div>
  </div>

  <div class="ol-celebrate" id="ol-celebrate" aria-hidden="true"><div class="ol-celebrate-glow"></div><div class="ol-celebrate-content"><div class="ol-celebrate-tier" id="ol-celebrate-tier"></div><div class="ol-celebrate-amount" id="ol-celebrate-amount"></div></div></div>
  <div class="ol-toast" id="ol-toast"></div>
</div>

<script src="/src/js/olympus/olympus-config.js?v=202610021911"></script>
<script src="/src/js/olympus/olympus-symbols.js?v=202610021911"></script>
<script src="/src/js/olympus/olympus-engine.js?v=202610021911"></script>
<script src="/src/js/olympus/olympus-audio.js?v=202610021911"></script>
<script src="/src/js/olympus/olympus-ui.js?v=202610021911"></script>
</body>
</html>
