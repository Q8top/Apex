<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奥林匹斯 · Apex Global Entertainment</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/apex-boot.css">
<link rel="stylesheet" href="/src/css/game.css">
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>

<header class="game-topbar" role="banner">
  <a class="game-icon-btn game-back" href="/" aria-label="返回">
    <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
  </a>
  <h1 class="game-title">奥林匹斯</h1>
  <button class="game-icon-btn game-share" type="button" id="game-share" aria-label="分享">
    <i class="ri-share-line" aria-hidden="true"></i>
  </button>
</header>

<main class="game-main">
  <div class="game-carousel" id="game-carousel">
    <div class="game-carousel-track" id="game-track" aria-live="polite"></div>
  </div>
  <div class="game-dots" id="game-dots" role="tablist" aria-label="轮播图指示器"></div>

    <!-- 游戏信息卡 -->
    <section class="game-info-card" aria-label="游戏信息">
      <div class="game-info-badges">
        <span class="game-badge game-badge--gold"><i class="ri-fire-fill" aria-hidden="true"></i>高波动</span>
        <span class="game-badge"><i class="ri-trophy-fill" aria-hidden="true"></i>2500x 最大赢</span>
      </div>
      <div class="game-info-tags">
        <span class="game-tag"><i class="ri-grid-fill" aria-hidden="true"></i>6×5 网格</span>
        <span class="game-tag"><i class="ri-focus-3-line" aria-hidden="true"></i>任意位置赔付</span>
        <span class="game-tag"><i class="ri-arrow-up-double-line" aria-hidden="true"></i>翻倍机制</span>
      </div>
    </section>

    <!-- 核心玩法 -->
    <section class="game-section" aria-label="核心玩法">
      <h2 class="game-section-title">核心玩法</h2>
      <div class="game-features-grid">
        <article class="game-feature-card">
          <div class="game-feature-icon game-feature-icon--gold">
            <i class="ri-cascade-line" aria-hidden="true"></i>
          </div>
          <h3 class="game-feature-title">翻倍掉落</h3>
          <p class="game-feature-desc">任意位置匹配 8 个以上符号即可获胜。获胜符号消失，新符号从上方落下，连击不断累积。</p>
        </article>
        <article class="game-feature-card">
          <div class="game-feature-icon game-feature-icon--purple">
            <i class="ri-flashlight-line" aria-hidden="true"></i>
          </div>
          <h3 class="game-feature-title">随机倍率</h3>
          <p class="game-feature-desc">每一轮旋转中，宙斯可能降下 2x–2500x 的倍率符号，同一轮内的所有倍率合并计算。</p>
        </article>
        <article class="game-feature-card">
          <div class="game-feature-icon game-feature-icon--cyan">
            <i class="ri-gift-line" aria-hidden="true"></i>
          </div>
          <h3 class="game-feature-title">免费旋转</h3>
          <p class="game-feature-desc">命中 4 个以上闪电 Scatter 触发 15 次免费旋转，期间所有倍率累加至本局总倍率。</p>
        </article>
      </div>
    </section>

    <!-- 符号赔付 -->
    <section class="game-section" aria-label="符号赔付">
      <h2 class="game-section-title">符号赔付</h2>
      <div class="game-payout-table">
        <div class="game-payout-head">
          <span>符号</span>
          <span>8 连</span>
          <span>10 连</span>
          <span>12+ 连</span>
        </div>
        <div class="game-payout-rows" id="game-payout-rows"></div>
      </div>
      <div class="game-scatter-note">
        <i class="ri-flashlight-fill" aria-hidden="true"></i>
        <span>4 / 5 / 6 个闪电 Scatter 分别赔付 <strong>3x / 5x / 100x</strong></span>
      </div>
    </section>
</main>

<nav class="game-actionbar" aria-label="游戏操作栏">
  <button type="button" class="game-action-btn" id="game-fav" aria-label="收藏">
    <i class="ri-star-line" aria-hidden="true"></i>
    <span>收藏</span>
  </button>
  <button type="button" class="game-action-btn" id="game-support" aria-label="客服">
    <i class="ri-customer-service-2-line" aria-hidden="true"></i>
    <span>客服</span>
  </button>
  <button type="button" class="game-action-plain" id="game-trial">免费试用</button>
  <button type="button" class="game-action-primary" id="game-start">开始游戏</button>
</nav>

<script src="/src/js/inline/apex-loader.js"></script>
<script src="/src/js/inline/game-page.js"></script>
</body>
</html>
