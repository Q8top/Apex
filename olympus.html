<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>奥林匹斯</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="/src/css/olympus.css?v=11">
</head>
<body class="ol-body">
<div class="ol-stage">
  <img class="ol-art" src="/assets/games/olympus-bg.jpeg" alt="" draggable="false">
  <div class="ol-grid" id="olGrid" aria-hidden="true"></div>
  <button class="ol-menu-btn" id="olMenu" aria-label="菜单">
    <i class="ri-menu-line" aria-hidden="true"></i>
  </button>
  <div class="ol-hud">
    <div class="ol-win-box">
      <span class="ol-win-label">赢得</span>
      <span class="ol-win-amount" id="olWin">¥0.00</span>
    </div>
    <div class="ol-info-row">
      <div class="ol-info-item">
        <i class="ri-wallet-3-line" aria-hidden="true"></i>
        <span class="ol-info-label">余额</span>
        <b class="ol-info-value" id="olBalance">¥0.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-coins-line" aria-hidden="true"></i>
        <span class="ol-info-label">下注</span>
        <b class="ol-info-value" id="olBet">¥1.00</b>
      </div>
      <div class="ol-info-item">
        <i class="ri-trophy-line" aria-hidden="true"></i>
        <span class="ol-info-label">本局赢得</span>
        <b class="ol-info-value" id="olRoundWin">¥0.00</b>
      </div>
    </div>
    <div class="ol-actions">
      <button class="ol-buy-btn" id="olBuy">
        <span class="ol-buy-label">购买免费旋转</span>
        <span class="ol-buy-price">¥100.00</span>
      </button>
      <div class="ol-spin-control">
        <button class="ol-bet-step" id="olBetMinus" aria-label="减小下注">
          <i class="ri-subtract-line" aria-hidden="true"></i>
        </button>
        <button class="ol-spin-btn" id="olSpin" aria-label="旋转">
          <i class="ri-refresh-line" aria-hidden="true"></i>
        </button>
        <button class="ol-bet-step" id="olBetPlus" aria-label="增大下注">
          <i class="ri-add-line" aria-hidden="true"></i>
        </button>
      </div>
      <div class="ol-ante">
        <div class="ol-ante-row">
          <span class="ol-ante-title">赌注</span>
          <label class="ol-switch">
            <input type="checkbox" id="olAnte">
            <span class="ol-switch-slider" aria-hidden="true"></span>
          </label>
        </div>
        <div class="ol-ante-sub">胜率翻倍功能</div>
      </div>
    </div>
    <div class="ol-bottom-row">
      <button class="ol-auto-btn" id="olAuto" aria-label="自动旋转">
        <i class="ri-loop-right-line" aria-hidden="true"></i>
      </button>
      <button class="ol-speed-btn" id="olSpeed" aria-label="加速">
        <i class="ri-flashlight-line" aria-hidden="true"></i>
        <span class="ol-speed-label" id="olSpeedLabel">1x</span>
      </button>
    </div>
  </div>
</div>
<script src="/src/js/inline/olympus.js?v=1"></script>
</body>
</html>
