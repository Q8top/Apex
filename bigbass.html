<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>大鱼大亨 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<link rel="stylesheet" href="/src/css/bigbass.css">
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
<link rel="stylesheet" href="/src/css/apex-skeleton.css">
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<svg id="bigbass-defs" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"></svg>
<div id="app">
  <header class="bb-bar">
    <a class="bb-icon-btn apex-back" href="/game.html?id=bigbass" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="bb-brand">大鱼大亨</div>
    <div class="bb-bar-right">
      <button class="bb-icon-btn" id="bb-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="bb-icon-btn" id="bb-menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <section class="bb-stage">
    <div class="bb-freespin-banner" id="bb-freespin-banner" hidden>
      <span>★ 免费旋转</span>
      <span class="bb-fs-count" id="bb-fs-count">0</span>
      <span class="bb-fs-level" id="bb-fs-level"></span>
    </div>
    <div class="bb-grid" id="bb-grid" aria-label="游戏网格"></div>
  </section>

  <section class="bb-win-row">
    <div class="bb-win-label" id="bb-win-label">本局中奖</div>
    <div class="bb-win-value" id="bb-win-value">¥0.00</div>
    <div class="bb-combo" id="bb-combo"></div>
  </section>

  <button class="bb-action-btn" type="button" id="bb-mode-action">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
    <span>重置余额</span>
  </button>

  <section class="bb-stats">
    <div class="bb-stat"><span class="bb-stat-label">余额</span><span class="bb-stat-value" id="bb-balance">¥1,000.00</span></div>
    <div class="bb-stat"><span class="bb-stat-label">下注</span><span class="bb-stat-value" id="bb-bet">¥10.00</span></div>
    <div class="bb-stat"><span class="bb-stat-label">赢得</span><span class="bb-stat-value" id="bb-won">¥0</span></div>
  </section>

  <section class="bb-bet-row">
    <button class="bb-bet-btn" id="bb-bet-minus" aria-label="减">−</button>
    <div class="bb-bet-txt" id="bb-bet-txt">下注 ¥10.00</div>
    <button class="bb-bet-btn" id="bb-bet-plus" aria-label="加">+</button>
  </section>

  <section class="bb-spin-row">
    <button class="bb-spin-btn" id="bb-spin">
      <svg class="bb-spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.51-7.13"/><path d="M21 3v6h-6"/></svg>
      <span>旋转</span>
    </button>
  </section>

  <section class="bb-foot">
    <button class="bb-foot-btn" id="bb-auto">
      <svg class="bb-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      <span>自动</span>
    </button>
    <button class="bb-foot-btn" id="bb-history">
      <svg class="bb-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>记录</span>
    </button>
    <button class="bb-foot-btn" id="bb-paytable">
      <svg class="bb-foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
      <span>赔付</span>
    </button>
  </section>

  <div class="bb-modal" id="bb-modal" aria-hidden="true">
    <div class="bb-modal-mask" data-close="1"></div>
    <div class="bb-modal-box">
      <div class="bb-modal-head">
        <div class="bb-modal-title" id="bb-modal-title">标题</div>
        <button class="bb-modal-x" id="bb-modal-x" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="bb-modal-body" id="bb-modal-body"></div>
    </div>
  </div>

  <div class="bb-fs-summary" id="bb-fs-summary">
    <div class="bb-fs-summary-glow"></div>
    <div class="bb-fs-summary-content">
      <div class="bb-fs-summary-title">免费旋转总赢分</div>
      <div class="bb-fs-summary-amount" id="bb-fs-total">¥0</div>
    </div>
  </div>

  <div class="bb-toast" id="bb-toast"></div>
</div>

<script src="/src/js/bigbass/bigbass-config.js"></script>
<script src="/src/js/bigbass/bigbass-symbols.js"></script>
<script src="/src/js/bigbass/bigbass-engine.js"></script>
<script src="/src/js/bigbass/bigbass-audio.js"></script>
<script src="/src/js/inline/bigwin.js"></script>
<script src="/src/js/bigbass/bigbass-ui.js"></script>
<script src="/src/js/inline/apex-loader.js"></script>
<script src="/src/js/inline/apex-page-transition.js"></script>
</body>
</html>
