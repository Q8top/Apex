<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>幸运水果 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<link rel="stylesheet" href="/src/css/slot.css">
</head>
<body>
<svg id="slot-defs" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <radialGradient id="c-red1" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#ff7a7a"/><stop offset="70%" stop-color="#dc3a3a"/><stop offset="100%" stop-color="#a81f1f"/></radialGradient>
    <radialGradient id="c-red2" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#f56b6b"/><stop offset="70%" stop-color="#c93030"/><stop offset="100%" stop-color="#951515"/></radialGradient>
    <radialGradient id="c-lemon" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#fef2a0"/><stop offset="60%" stop-color="#f0d550"/><stop offset="100%" stop-color="#d4a828"/></radialGradient>
    <radialGradient id="c-orange" cx="35%" cy="28%" r="80%"><stop offset="0%" stop-color="#ffb877"/><stop offset="60%" stop-color="#ef8a3e"/><stop offset="100%" stop-color="#c86320"/></radialGradient>
    <radialGradient id="c-gp1" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#c89cf0"/><stop offset="60%" stop-color="#9060c0"/><stop offset="100%" stop-color="#603a90"/></radialGradient>
    <radialGradient id="c-gp2" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#b088e0"/><stop offset="60%" stop-color="#7a4aa8"/><stop offset="100%" stop-color="#522e80"/></radialGradient>
    <radialGradient id="c-wm" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#7ec26a"/><stop offset="70%" stop-color="#3f8f3f"/><stop offset="100%" stop-color="#1f6028"/></radialGradient>
    <radialGradient id="c-wm2" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#ff8080"/><stop offset="70%" stop-color="#e5484d"/><stop offset="100%" stop-color="#b02028"/></radialGradient>
    <linearGradient id="c-bell" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbe88a"/><stop offset="45%" stop-color="#e8b842"/><stop offset="100%" stop-color="#a07812"/></linearGradient>
    <linearGradient id="c-bell2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d8a830"/><stop offset="100%" stop-color="#8a6010"/></linearGradient>
    <linearGradient id="c-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a2a2a"/><stop offset="50%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#000"/></linearGradient>
    <linearGradient id="c-7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff7a7a"/><stop offset="55%" stop-color="#e53838"/><stop offset="100%" stop-color="#a01818"/></linearGradient>
    <linearGradient id="c-g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff3a8"/><stop offset="45%" stop-color="#f0c33e"/><stop offset="100%" stop-color="#a07020"/></linearGradient>
    <radialGradient id="c-wg" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff3b8"/><stop offset="60%" stop-color="#e8b83e"/><stop offset="100%" stop-color="#a07810"/></radialGradient>
  </defs>
</svg>

<div id="app">

  <header class="bar">
    <a class="icon-btn" href="/game.html?id=lucky-fruit" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="brand">幸运水果</div>
    <div class="bar-right">
      <button class="icon-btn" id="btn-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="icon-btn" id="btn-menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <section class="reels" id="reels" aria-label="转轮"></section>

  <section class="win-row">
    <div class="win-label" id="win-label">本局中奖</div>
    <div class="win-value" id="win-value">¥0.00</div>
  </section>

  <section class="stats">
    <div class="stat"><span class="stat-label">余额</span><span class="stat-value" id="balance">¥1,000.00</span></div>
    <div class="stat"><span class="stat-label">下注</span><span class="stat-value" id="bet">¥10.00</span></div>
    <div class="stat"><span class="stat-label">赢得</span><span class="stat-value" id="won">¥0</span></div>
  </section>

  <section class="bet-row">
    <button class="bet-btn" id="bet-minus" aria-label="减">−</button>
    <div class="bet-txt" id="bet-txt">下注 ¥10.00</div>
    <button class="bet-btn" id="bet-plus" aria-label="加">+</button>
  </section>

  <section class="spin-row">
    <button class="spin-btn" id="spin">
      <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.51-7.13"/><path d="M21 3v6h-6"/></svg>
      <span>旋转</span>
    </button>
  </section>

  <section class="foot">
    <button class="foot-btn" id="btn-auto">
      <svg class="foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      <span>自动</span>
    </button>
    <button class="foot-btn" id="btn-history">
      <svg class="foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>记录</span>
    </button>
    <button class="foot-btn" id="btn-mode-action" style="display:none"></button>
    <button class="foot-btn" id="btn-paytable">
      <svg class="foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
      <span>赔付</span>
    </button>
  </section>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">标题</div>
        <button class="modal-x" id="modal-x" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="slot-flash" id="flash"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="/src/js/slot/slot-symbols.js"></script>
<script src="/src/js/slot/slot-config.js"></script>
<script src="/src/js/slot/slot-engine.js"></script>
<script src="/src/js/slot/slot-audio.js"></script>
<script src="/src/js/slot/slot-ui.js"></script>
</body>
</html>
