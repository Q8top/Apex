<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>幸运水果 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/src/css/slot.css">
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <header class="bar">
    <button class="icon-btn" id="btn-menu" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">幸运水果</div>
    <div class="bar-right">
      <button class="icon-btn" id="btn-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 累计大奖 -->
  <section class="jackpot">
    <div class="jackpot-label">累计大奖</div>
    <div class="jackpot-value" id="jackpot">¥12,580.00</div>
  </section>

  <!-- 转轮 -->
  <section class="reels" id="reels"></section>

  <!-- 中奖提示 -->
  <section class="win-row">
    <div class="win-label" id="win-label">恭喜中奖</div>
    <div class="win-value" id="win-value">+ ¥0.00</div>
  </section>

  <!-- 三信息栏 -->
  <section class="stats">
    <div class="stat"><span class="stat-label">余额</span><span class="stat-value" id="balance">¥1,000</span></div>
    <div class="stat"><span class="stat-label">下注</span><span class="stat-value" id="bet">¥10.00</span></div>
    <div class="stat"><span class="stat-label">赢得</span><span class="stat-value" id="won">¥0</span></div>
  </section>

  <!-- 下注调整 -->
  <section class="bet-row">
    <button class="bet-btn" id="bet-minus">−</button>
    <div class="bet-txt">下注金额</div>
    <button class="bet-btn" id="bet-plus">+</button>
  </section>

  <!-- 旋转按钮 -->
  <section class="spin-row">
    <button class="spin-btn" id="spin">旋转</button>
  </section>

  <!-- 底部功能 -->
  <section class="foot">
    <button class="foot-btn" id="btn-auto">自动</button>
    <button class="foot-btn" id="btn-max">最大下注</button>
    <button class="foot-btn" id="btn-help">玩法</button>
  </section>

</div>

<script src="/src/js/slot/slot-symbols.js"></script>
<script src="/src/js/slot/slot-config.js"></script>
<script src="/src/js/slot/slot-engine.js"></script>
<script src="/src/js/slot/slot-ui.js"></script>
</body>
</html>
