<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0a12">
  <title>甜蜜爆奖</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/games/sugar-rush/css/game-v2.css">
</head>
<body class="sr-body">
  <div class="sr-app" id="sr-app">
    <header class="sr-header">
      <button class="sr-header-btn" id="sr-back-btn" aria-label="返回"><svg class="sr-ic" aria-hidden="true"><use href="#ic-arrow-left"/></svg></button>
      <div class="sr-header-main">
        <h1 class="sr-header-title">甜蜜爆奖</h1>
        <span class="sr-header-sub">试玩模式</span>
      </div>
      <button class="sr-header-btn" id="sr-menu-btn" aria-label="菜单"><svg class="sr-ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>
    </header>
    <main class="sr-main" id="sr-main">
      <section class="sr-stage" id="sr-stage">
        <div class="sr-board" id="sr-board" role="grid" aria-label="游戏棋盘" aria-live="polite"></div>
        <div class="sr-tumble-counter" id="sr-tumble-counter" hidden></div>
        <div class="sr-win-area" id="sr-win-area" hidden></div>
      </section>
      <section class="sr-stats">
        <div class="sr-stat"><span class="sr-stat-label">试玩余额</span><span class="sr-stat-value" id="sr-balance">¥0.00</span></div>
        <div class="sr-stat"><span class="sr-stat-label">投注金额</span><span class="sr-stat-value" id="sr-bet-display">¥1.00</span></div>
        <div class="sr-stat"><span class="sr-stat-label">本局赢得</span><span class="sr-stat-value" id="sr-win">¥0.00</span></div>
      </section>
      <section class="sr-controls">
        <div class="sr-bet">
          <button class="sr-bet-btn" id="sr-bet-minus" aria-label="减少投注"><svg class="sr-ic" aria-hidden="true"><use href="#ic-minus"/></svg></button>
          <span class="sr-bet-value" id="sr-bet">¥1.00</span>
          <button class="sr-bet-btn" id="sr-bet-plus" aria-label="增加投注"><svg class="sr-ic" aria-hidden="true"><use href="#ic-plus"/></svg></button>
        </div>
        <div class="sr-ctrl-row">
          <button class="sr-ctrl" id="sr-auto-btn"><svg class="sr-ic" aria-hidden="true"><use href="#ic-repeat"/></svg><span class="sr-ctrl-label">自动</span></button>
          <button class="sr-ctrl sr-ctrl--primary" id="sr-spin-btn"><svg class="sr-ic sr-ic-lg" aria-hidden="true"><use href="#ic-rotate"/></svg><span class="sr-ctrl-label">旋转</span></button>
          <button class="sr-ctrl" id="sr-fast-btn"><svg class="sr-ic" aria-hidden="true"><use href="#ic-zap"/></svg><span class="sr-ctrl-label">极速</span></button>
        </div>
      </section>
    </main>
    <div class="sr-sheet-root" id="sr-sheet-root" hidden>
      <div class="sr-sheet-backdrop" id="sr-sheet-backdrop"></div>
      <div class="sr-sheet" role="dialog" aria-modal="true" aria-labelledby="sr-sheet-title">
        <div class="sr-sheet-handle"></div>
        <header class="sr-sheet-header"><h2 class="sr-sheet-title" id="sr-sheet-title">菜单</h2></header>
        <nav class="sr-sheet-nav" id="sr-sheet-nav"></nav>
      </div>
    </div>
    <div class="sr-confirm-root" id="sr-confirm-root" hidden>
      <div class="sr-confirm-backdrop"></div>
      <div class="sr-confirm" role="dialog" aria-modal="true">
        <h3 class="sr-confirm-title" id="sr-confirm-title"></h3>
        <div class="sr-confirm-body" id="sr-confirm-body"></div>
        <div class="sr-confirm-actions">
          <button class="sr-confirm-btn" id="sr-confirm-cancel">取消</button>
          <button class="sr-confirm-btn sr-confirm-btn--primary" id="sr-confirm-ok">确定</button>
        </div>
      </div>
    </div>
    <div class="sr-toast" id="sr-toast" hidden></div>
  </div>
  <svg style="display:none" aria-hidden="true"><defs>
    <symbol id="ic-arrow-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0114-3l3 3M20 15a8 8 0 01-14 3l-3-3M17 6v3h3M7 18v-3H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-rotate" viewBox="0 0 24 24"><path d="M12 5a7 7 0 107 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 2v6l3-3z" fill="currentColor"/></symbol>
    <symbol id="ic-zap" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/></symbol>
    <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-book" viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 013 3v11H7a3 3 0 01-3-3V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 16h14" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ic-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs></svg>
  <!-- Engine + Config + Platform (money-path, KEPT) -->
  <script src="/src/config/version.js"></script>
  <script src="/src/games/sugar-rush/config/symbols.locked.js"></script>
  <script src="/src/games/sugar-rush/config/paytable.locked.js"></script>
  <script src="/src/games/sugar-rush/config/math-profile.js"></script>
  <script src="/src/games/sugar-rush/engine/errors.js"></script>
  <script src="/src/games/sugar-rush/engine/grid.js"></script>
  <script src="/src/games/sugar-rush/engine/rng.js"></script>
  <script src="/src/games/sugar-rush/engine/payout.js"></script>
  <script src="/src/games/sugar-rush/engine/multiplier.js"></script>
  <script src="/src/games/sugar-rush/engine/evaluator.js"></script>
  <script src="/src/games/sugar-rush/engine/tumble.js"></script>
  <script src="/src/games/sugar-rush/engine/bonus.js"></script>
  <script src="/src/games/sugar-rush/engine/cap.js"></script>
  <script src="/src/games/sugar-rush/engine/game-engine.js"></script>
  <script src="/src/js/platform/i18n.js"></script>
  <script src="/src/js/apiClient.js"></script>
  <script src="/src/js/presentation/error-reporter.js"></script>
  <script src="/src/js/presentation/reconnection.js"></script>
  <script src="/src/js/presentation/perf.js"></script>
  <script src="/src/js/presentation/a11y.js"></script>
  <script src="/src/js/presentation/haptics.js"></script>
  <script src="/src/js/presentation/autospin.js"></script>
  <script src="/src/js/presentation/animator.js"></script>
  <script src="/src/js/presentation/anticipation.js"></script>
  <script src="/src/js/presentation/audio-bridge.js"></script>
  <!-- UI v2 (Parts 2-7 will create) -->
  <script src="/src/games/sugar-rush/js/symbols-v3.js" defer></script>
  <script src="/src/games/sugar-rush/js/audio-v2.js" defer></script>
  <script src="/src/games/sugar-rush/js/ui/sheet-v2.js" defer></script>
  <script src="/src/games/sugar-rush/js/ui/rules-v2.js" defer></script>
  <script src="/src/games/sugar-rush/js/ui/settings-v2.js" defer></script>
  <script src="/src/games/sugar-rush/js/ui/history-v2.js" defer></script>
  <script src="/src/games/sugar-rush/js/main-v2.js" defer></script>
</body>
</html>
