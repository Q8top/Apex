<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地预览 - 电子游戏分类</title>
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/apex-app.css">
<style>
  body { background: #f5f5f5; margin: 0; padding: 20px; font-family: system-ui, sans-serif; }
  .apex-game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .apex-game-card { background: #fff; border-radius: 12px; overflow: hidden; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .apex-game-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .apex-game-card-name { padding: 8px; font-size: 13px; font-weight: 600; color: #333; }
  h2 { font-size: 18px; color: #333; margin-top: 0; }
</style>
</head>
<body>
  <h2>电子游戏分类 (本地预览)</h2>
  <div class="apex-game-grid" id="grid"></div>
  <script src="/src/games/registry.js"></script>
  <script>
    var GAMES = window.ApexGamesRegistry.GAMES;
    var html = '';
    GAMES.forEach(function(g) {
      html += '<div class="apex-game-card" onclick="location.href=\'/loading.html?game=' + g.id + '&mode=demo\'">' +
              '<img src="' + g.src + '" alt="' + g.n + '">' +
              '<div class="apex-game-card-name">' + g.n + '</div>' +
              '</div>';
    });
    document.getElementById('grid').innerHTML = html;
  </script>
</body>
</html>
