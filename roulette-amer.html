<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex">
<title>美式轮盘 · Apex</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<link rel="stylesheet" href="/src/css/roulette.css?v=1">
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<div id="app">
  <header class="rl-bar">
    <a class="rl-icon-btn" href="/game.html?id=roulette-american" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="rl-brand">美式轮盘</div>
    <div class="rl-bar-right">
      <button class="rl-icon-btn" id="rl-sound" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
      </button>
      <button class="rl-icon-btn" id="rl-history" aria-label="记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="rl-icon-btn" id="rl-menu" aria-label="规则">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.4 2.4 0 0 1 4.6 1c0 1.9-2.8 1.9-2.8 3.6"/><circle cx="11.3" cy="17" r="0.6" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <section class="rl-wheel-area">
    <div class="rl-wheel-wrap" id="rl-wheel-wrap">
      <div id="rl-wheel-svg"></div>
      <div class="rl-ball-wrap" id="rl-ball-wrap"><div class="rl-ball-orbit" id="rl-ball-orbit"><div class="rl-ball"><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9" fill="#fff" stroke="#0a0a0a" stroke-width="1"/><ellipse cx="7" cy="7" rx="3" ry="2" fill="#fff" opacity=".9"/></svg></div></div></div>
      <div class="rl-result-num" id="rl-result-num"></div>
    </div>
  </section>

  <section class="rl-win-row">
    <div class="rl-win-label">本局收获</div>
    <div class="rl-win-value" id="rl-win-value">¥0.00</div>
  </section>

  <button class="rl-action-btn" type="button" id="rl-mode-action" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:38px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.3px;cursor:pointer;box-shadow:var(--sh-1);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke:currentColor;fill:nonelette;"><path d="M3 -e12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
    <span>重置余额</span>
  </button>

  <section class="rl-stats">
    <div class="rl-stat"><span class="rl-stat-label">余额</span><span class="rl-stat-value" id="rl-balance">¥1,000.00</span></div>
    <div class="rl-stat"><span class="rl-stat-label">下注</span><span class="rl-stat-value" id="rl-bet">¥10.00</span></div>
    <div class="rl-stat"><span class="rl-stat-label">已下注</span><span class="rl-stat-value" id="rl-total-bet">¥0.00</span></div>
  </section>

  <section class="rl-bet-row">
    <button class="rl-bet-btn" id="rl-bet-minus" aria-label="减">−</button>
    <div class="rl-bet-txt" id="rl-bet-txt">下注 ¥10.00</div>
    <button class="rl-bet-btn" id="rl-bet-plus" aria-label="加">+</button>
  </section>

  <section class="rl-board">
    <div class="rl-grid" id="rl-grid"></div>
  </section>

  <section class="rl-action-row">
    <button class="rl-btn rl-btn-spin" id="rl-spin">旋转</button>
    <button class="rl-btn rl-btn-clear" id="rl-clear">清除</button>
  </section>

  <div class="rl-modal" id="rl-modal" aria-hidden="true">
    <div class="rl-modal-mask"></div>
    <div class="rl-modal-box">
      <div class="rl-modal-head">
        <div class="rl-modal-title" id="rl-modal-title">标题</div>
        <button class="rl-modal-x" id="rl-modal-x" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="rl-modal-body" id="rl-modal-body"></div>
    </div>
  </div>

  <div class="rl-toast" id="rl-toast"></div>
</div>

<script src="/src/js/roulette/roulette-config.js?v=1"></script>
<script src="/src/js/roulette/roulette-symbols.js?v=1"></script>
<script src="/src/js/roulette/roulette-engine.js?v=1"></script>
<script src="/src/js/roulette/roulette-audio.js?v=1"></script>
<script src="/src/js/roulette/roulette-ui.js?v=1"></script>
<script src="/src/js/inline/apex-loader.js"></script>
</body>
</html>
