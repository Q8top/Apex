<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奥林匹斯之门 · 游戏中</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/src/css/olympus-game.css">
<style>html,body,*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}</style>
</head>
<body>

<div id="ol-root" class="ol-root" data-mode="demo">

  <header class="ol-topbar">
    <a class="ol-tb-btn" href="/olympus.html" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="ol-title" id="ol-title">奥林匹斯之门 · 试玩</div>
    <button type="button" class="ol-tb-btn" id="ol-btn-sound" aria-label="音效">
      <svg class="ol-ico-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a9 9 0 010 14"/></svg>
      <svg class="ol-ico-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
    </button>
    <button type="button" class="ol-tb-btn" id="ol-btn-menu" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <main class="ol-stage">
    <div class="ol-grid" id="ol-grid" role="grid" aria-label="游戏网格"></div>
  </main>

  <section class="ol-win-section">
    <div class="ol-win-label">本局中奖</div>
    <div class="ol-win-val" id="ol-win-val">¥0.00</div>
  </section>

  <button type="button" class="ol-reset" id="ol-reset" aria-label="重置余额">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
    <span>重置余额</span>
  </button>

  <section class="ol-stats">
    <div class="ol-stat">
      <div class="ol-stat-label">余额</div>
      <div class="ol-stat-val" id="ol-balance">¥1,000.00</div>
    </div>
    <div class="ol-stat">
      <div class="ol-stat-label">下注</div>
      <div class="ol-stat-val" id="ol-bet-display">¥10.00</div>
    </div>
    <div class="ol-stat">
      <div class="ol-stat-label">赢得</div>
      <div class="ol-stat-val" id="ol-total-win">¥0</div>
    </div>
  </section>

  <section class="ol-bet-row">
    <button type="button" class="ol-bet-btn" id="ol-bet-minus" aria-label="减小下注">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <div class="ol-bet-current" id="ol-bet-val">下注 ¥10.00</div>
    <button type="button" class="ol-bet-btn" id="ol-bet-plus" aria-label="增加下注">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <button type="button" class="ol-spin-btn" id="ol-spin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.51-7.13"/><path d="M21 4v6h-6"/></svg>
    <span>旋转</span>
  </button>

  <nav class="ol-bottom-nav">
    <button type="button" class="ol-nav-btn" id="ol-auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10"/><path d="M3.51 15a9 9 0 0014.85 3.36L23 14"/></svg>
      <span>自动</span>
    </button>
    <button type="button" class="ol-nav-btn" id="ol-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>记录</span>
    </button>
    <button type="button" class="ol-nav-btn" id="ol-paytable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      <span>赔付</span>
    </button>
  </nav>

  <div class="ol-toast" id="ol-toast" role="status" aria-live="polite"></div>

</div>

<script src="/src/js/apiClient.js?v=20260927e"></script>
<script src="/src/js/games/olympus/audio.js"></script>
<script src="/src/js/games/olympus/main.js"></script>
</body>
</html>
