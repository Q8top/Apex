name: Deploy to Cloudflare Pages

# 仅在 CI 成功后触发部署
# 防止：CI 失败但代码仍被部署到生产
on:
  workflow_run:
    workflows: ["CI - Test & Security Scan"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 手动触发 OR CI 成功
    # 安全校验：
    #   1. 手动触发；或
    #   2. workflow_run 完成且结论为 success，且 head_repository 必须是本仓库
    #      （防止 fork PR 触发 CI 后绕过分支过滤，进入带 secrets 的部署上下文）
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # workflow_run 时 checkout 对应的 commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Add node_modules/.bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Pre-deploy safety check
        run: |
          set -e
          BAD=$(find . -maxdepth 1 -type f \
            \( -name 'Apex_*.txt' -o -name '*.bak*' -o -name '*.sql' -o -name '*.sql.gz' \) \
            2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "[FATAL] 检测到不应部署的文件："
            echo "$BAD"
            exit 1
          fi
          if [ ! -f .assetsignore ]; then
            echo "[FATAL] 缺少 .assetsignore"
            exit 1
          fi
          echo "[OK] 部署前安全检查通过"

      - name: Apply D1 migrations (remote)
        run: bash scripts/migrate.sh --remote

      - name: Build dist
        run: bash scripts/build-dist.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=apex --branch=main

      - name: Post-deploy health check
        run: |
          set -e
          BASE="${{ vars.DEPLOY_BASE_URL }}"
          if [ -z "$BASE" ]; then
            echo "[SKIP] DEPLOY_BASE_URL 未配置"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "[OK] /api/health 返回 200"
              exit 0
            fi
            echo "[WAIT] 第 $i 次尝试，HTTP $code"
            sleep 10
          done
          echo "[FATAL] 部署后健康检查失败"
          exit 1

      - name: Purge CDN cache
        if: success()
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
        run: |
          set -e
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_TOKEN" ]; then
            echo "[SKIP] 未配置 CLOUDFLARE_ZONE_ID 或 CLOUDFLARE_CACHE_TOKEN"
            exit 0
          fi
          echo "[PURGE] 清空 CDN 缓存..."
          RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$RESP" | grep -q '"success":true'; then
            echo "[OK] CDN 缓存已清空"
          else
            echo "[WARN] 清缓存失败（不阻塞部署）"
            echo "$RESP"
          fi
