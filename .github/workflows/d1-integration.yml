name: D1 Integration Test (manual)

# 施工单 §A-3b 要求：真实 Worker + D1 集成测试
#
# 本 workflow 只在手动触发时运行，避免：
#   - 自动跑占用 Cloudflare D1 免费配额
#   - 污染生产数据
#
# 机制：
#   1. 建临时 D1（apex-test-<时间戳>）
#   2. 跑全部迁移
#   3. wrangler d1 execute 验证 schema / trigger / 约束
#   4. 跑 SQL 层守卫机制测试（INSERT guard + CHECK 触发回滚）
#   5. 删除临时 D1
#
# 局限：
#   wrangler d1 execute 每次是一独立 batch，无法测 Worker 里的多语句事务行为。
#   Worker 层守卫机制需要部署临时 Pages 用 --d1 挂载测试，本 workflow 不覆盖。
#   因此本 workflow 只能验证 D1 接受本项目的 DDL 与基础约束。
#
# 通过本 workflow ≠ A-3b 定稿。

on:
  workflow_dispatch:
    inputs:
      keep_db:
        description: '保留测试 D1（debug 用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  d1-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: apex-test-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Create temp D1
        id: create
        run: |
          set -euo pipefail
          echo "[CREATE] $DB_NAME"
          OUT=$(npx wrangler d1 create "$DB_NAME" --json 2>&1 || true)
          echo "$OUT"
          DB_ID=$(echo "$OUT" | grep -oE '"uuid"[[:space:]]*:[[:space:]]*"[a-f0-9-]+"' | head -1 | grep -oE '[a-f0-9-]{36}')
          if [ -z "$DB_ID" ]; then
            echo "[FATAL] 无法从 wrangler 输出提取 uuid"
            exit 1
          fi
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "[OK] db_id=$DB_ID"

      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "[MIG] $f"
            # duplicate column / already exists 视为已应用（幂等）
            npx wrangler d1 execute "$DB_NAME" --remote --file="$f" 2>&1 \
              | tee /tmp/mig.log \
              | grep -E "duplicate column|already exists|Executed" || true
          done
          echo "[OK] all migrations attempted"

      - name: Verify schema
        run: |
          set -euo pipefail
          for t in users sessions spins free_spin_sessions wallet_ledger reward_chains _settlement_guard; do
            CNT=$(npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT COUNT(*) AS c FROM $t" --json 2>&1 | grep -oE '"c":[0-9]+' | head -1 | grep -oE '[0-9]+')
            echo "[TABLE] $t rows=$CNT"
          done
          # trigger 存在性
          for trg in trg_users_balance_nonnegative_update trg_users_balance_nonnegative_insert trg_sessions_limit; do
            CNT=$(npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT COUNT(*) AS c FROM sqlite_master WHERE type='trigger' AND name='$trg'" --json 2>&1 | grep -oE '"c":[0-9]+' | head -1 | grep -oE '[0-9]+')
            if [ "$CNT" = "1" ]; then
              echo "[TRIGGER OK] $trg"
            else
              echo "[TRIGGER MISS] $trg"
              exit 1
            fi
          done
          # spins 扩展列
          for col in request_fingerprint effective_bet_minor fs_session_id chain_id balance_delta; do
            CNT=$(npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT COUNT(*) AS c FROM pragma_table_info('spins') WHERE name='$col'" --json 2>&1 | grep -oE '"c":[0-9]+' | head -1 | grep -oE '[0-9]+')
            if [ "$CNT" = "1" ]; then
              echo "[COL OK] spins.$col"
            else
              echo "[COL MISS] spins.$col"
              exit 1
            fi
          done

      - name: Test guard mechanism (SQL level)
        run: |
          set -euo pipefail
          # 建测试用户
          npx wrangler d1 execute "$DB_NAME" --remote --command "INSERT INTO users (username,email,password_hash,wallet_balance) VALUES ('t1','t1@e','h',1000)"
          # 1. 扣款成功 + 守卫
          npx wrangler d1 execute "$DB_NAME" --remote --command "UPDATE users SET wallet_balance=wallet_balance-100 WHERE username='t1' AND wallet_balance>=100; INSERT INTO _settlement_guard (slot,guard_value) VALUES (1,CASE WHEN changes()=1 THEN 1 ELSE 0 END) ON CONFLICT(slot) DO UPDATE SET guard_value=CASE WHEN changes()=1 THEN 1 ELSE 0 END"
          BAL=$(npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT wallet_balance AS b FROM users WHERE username='t1'" --json 2>&1 | grep -oE '"b":[0-9]+' | grep -oE '[0-9]+')
          echo "[TEST 1] balance after debit = $BAL (expect 900)"
          [ "$BAL" = "900" ] || exit 1

          # 2. 余额不足扣款 → trigger 阻挡 OR 守卫失败
          # 用 0 行 UPDATE + 守卫
          RESULT=$(npx wrangler d1 execute "$DB_NAME" --remote --command "UPDATE users SET wallet_balance=wallet_balance-99999 WHERE username='t1' AND wallet_balance>=99999; INSERT INTO _settlement_guard (slot,guard_value) VALUES (1,CASE WHEN changes()=1 THEN 1 ELSE 0 END) ON CONFLICT(slot) DO UPDATE SET guard_value=CASE WHEN changes()=1 THEN 1 ELSE 0 END" 2>&1 || echo "ABORTED")
          if echo "$RESULT" | grep -q "CHECK constraint failed"; then
            echo "[TEST 2] guard ABORT 生效"
          else
            echo "[TEST 2] WARN: guard ABORT 未触发（D1 行为可能与 SQLite 不同）"
            echo "$RESULT" | tail -10
          fi
          BAL=$(npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT wallet_balance AS b FROM users WHERE username='t1'" --json 2>&1 | grep -oE '"b":[0-9]+' | grep -oE '[0-9]+')
          echo "[TEST 2] balance unchanged = $BAL (expect 900)"

          # 3. 负余额 trigger
          RESULT=$(npx wrangler d1 execute "$DB_NAME" --remote --command "UPDATE users SET wallet_balance=-1 WHERE username='t1'" 2>&1 || echo "ABORTED")
          if echo "$RESULT" | grep -q "insufficient_balance"; then
            echo "[TEST 3] 负余额 trigger 生效"
          else
            echo "[TEST 3] WARN: 负余额 trigger 未触发"
            echo "$RESULT" | tail -5
          fi

      - name: Cleanup temp D1
        if: always() && inputs.keep_db != 'true'
        run: |
          echo "[DELETE] $DB_NAME"
          npx wrangler d1 delete "$DB_NAME" -y 2>&1 || echo "[WARN] delete failed (可能需手动删除)"

      - name: Summary
        if: always()
        run: |
          echo "=== D1 Integration Test Summary ==="
          echo "DB: $DB_NAME"
          echo "keep_db: ${{ inputs.keep_db }}"
          echo "如失败请查看各 step 日志"
