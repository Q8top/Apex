name: Daily Database Backup

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）
    - cron: '0 3 * * *'
  workflow_dispatch:  # 支持手动触发

# 最小权限：Workflow 顶层只读。写权限由 backup job 单独声明。
permissions:
  contents: read

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 该 job 需要上传 GitHub Release，因此单独声明 contents: write
    # 其他 job 应保持顶层的最小权限
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # age 加密公钥（不是私钥）。私钥必须离线保存，绝不进 CI。
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Wrangler
        # 与本地 wrangler 4.86.0 对齐，避免 CI 与本地行为不一致
        run: npm install -g wrangler@4

      - name: Install age
        run: |
          set -euo pipefail
          # age 用于备份加密。Ubuntu runner 默认可能没有 age，显式安装。
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      # ============================================================
      # 双通道备份：GitHub Release + Cloudflare KV
      # ============================================================
      - name: Run backup-remote.sh
        run: bash scripts/backup-remote.sh

      # ============================================================
      # 独立校验：确保备份可恢复
      # ============================================================
      - name: Verify backup via restore dry-run
        run: |
          set -euo pipefail
          bash scripts/restore-from-remote.sh --from-kv --dry-run

      # 注意：不再将数据库备份 commit 到 git 分支。
      # 原因：备份包含用户数据，即使已 gzip 也未加密，属于明文数据库副本。
      # 现在仅通过加密后的 GitHub Release + Cloudflare KV 双通道保存。
      # 加密方式见 scripts/backup-remote.sh（age 公钥加密）。
