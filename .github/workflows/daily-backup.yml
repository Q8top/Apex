name: Daily Database Backup

on:
  # 定时触发已禁用：本 workflow 需要 CLOUDFLARE_KV_NAMESPACE_ID / AGE_PUBLIC_KEY
  # 两个 secret，当前项目未配置 KV + age 加密备份流程。
  # 保留 workflow_dispatch 供未来手动触发（配好 secret 后可恢复 schedule）。
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:  # 手动触发

# 最小权限：Workflow 顶层只读。写权限由 backup job 单独声明。
permissions:
  contents: read

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 该 job 需要上传 GitHub Release，因此单独声明 contents: write
    # 其他 job 应保持顶层的最小权限
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # age 加密公钥（不是私钥）。私钥必须离线保存，绝不进 CI。
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install Wrangler
        # 与本地 wrangler 4.86.0 对齐，避免 CI 与本地行为不一致
        run: npm install -g wrangler@4

      - name: Install age
        run: |
          set -euo pipefail
          # age 用于备份加密。Ubuntu runner 默认可能没有 age，显式安装。
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      # ============================================================
      # 双通道备份：GitHub Release + Cloudflare KV
      # ============================================================
      - name: Run backup-remote.sh
        run: bash scripts/backup-remote.sh

      # ============================================================
      # CI 侧完整性校验
      # ------------------------------------------------------------
      # 注意：CI 里【绝不】持有 age 私钥（安全设计），因此不能做
      # 完整解密 + SQLite integrity 校验。此处只验证上传到 KV 的
      # 备份文件本身是完整的、且确实是 age 加密文件。
      #
      # 完整的"解密 + 导入临时 SQLite + integrity_check"必须由
      # 你本地手动执行（见 docs/backup-rpo-rto.md 恢复 Runbook）：
      #
      #   AGE_SECRET_KEY_FILE=~/apex-backup-key.txt \
      #     bash scripts/restore-from-remote.sh --from-kv --latest --dry-run
      # ============================================================
      - name: Verify uploaded backup integrity
        run: |
          set -euo pipefail
          KEY="backup:latest"
          TMP="$(mktemp)"
          echo "[VERIFY] 下载 KV key: $KEY"
          if ! wrangler kv key get \
               --namespace-id="$CLOUDFLARE_KV_NAMESPACE_ID" \
               "$KEY" \
               --remote > "$TMP"; then
            echo "[FATAL] 无法从 KV 下载备份"
            rm -f "$TMP"
            exit 1
          fi

          SIZE=$(stat -c%s "$TMP" 2>/dev/null || wc -c < "$TMP")
          echo "[VERIFY] 备份大小: ${SIZE}B"
          if [ "$SIZE" -lt 100 ]; then
            echo "[FATAL] 备份文件过小（<${SIZE}B）"
            rm -f "$TMP"
            exit 1
          fi

          # age v1 加密文件的固定 header（二进制对比前 21 字节 ASCII）
          EXPECTED="age-encryption.org/v1"
          ACTUAL=$(head -c 21 "$TMP" 2>/dev/null || true)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "[FATAL] 备份不是有效的 age 加密文件"
            echo "  期望 header: $EXPECTED"
            echo "  实际 header: $ACTUAL"
            rm -f "$TMP"
            exit 1
          fi

          echo "[OK] 备份完整性校验通过（age 加密，${SIZE}B）"
          echo "[INFO] 完整解密与恢复演练请本地执行（CI 无私钥）"
          rm -f "$TMP"

      # 注意：不再将数据库备份 commit 到 git 分支。
      # 原因：备份包含用户数据，即使已 gzip 也未加密，属于明文数据库副本。
      # 现在仅通过加密后的 GitHub Release + Cloudflare KV 双通道保存。
      # 加密方式见 scripts/backup-remote.sh（age 公钥加密）。
