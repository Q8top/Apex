name: Daily Database Backup

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）
    - cron: '0 3 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      # ============================================================
      # 双通道备份：GitHub Release + Cloudflare KV
      # ============================================================
      - name: Run backup-remote.sh
        run: bash scripts/backup-remote.sh

      # ============================================================
      # 独立校验：确保备份可恢复
      # ============================================================
      - name: Verify backup via restore dry-run
        run: |
          set -euo pipefail
          bash scripts/restore-from-remote.sh --from-kv --dry-run

      # ============================================================
      # 保底：备份也提交到 backups 分支（历史兼容）
      # ============================================================
      - name: Commit to backups branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backups/
          git diff --cached --quiet && { echo "[SKIP] 无变化"; exit 0; }
          git commit -m "chore: daily backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:backups

      # ============================================================
      # 校验备份分支同步成功
      # ============================================================
      - name: Verify backups branch updated
        run: |
          git ls-remote origin backups | grep -q backups && echo "[OK] backups 分支存在"
