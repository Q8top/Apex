name: CI - Test & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：只有读代码的权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        # 不再回退到 npm install：
        #   npm ci 失败 = lockfile 与 package.json 不一致，
        #   必须修 lockfile，不能绕过可复现性
        run: npm ci --ignore-scripts

      - name: Sync engine to functions/ (check consistency)
        run: |
          bash scripts/sync-engine.sh
          if ! git diff --quiet -- functions/_engine functions/_config; then
            echo "[FATAL] functions/_engine 或 functions/_config 与 src/ 不一致"
            echo "  请在本地跑 bash scripts/sync-engine.sh 后一起提交"
            git --no-pager diff --stat -- functions/_engine functions/_config
            exit 1
          fi
          echo "[OK] functions/_engine 与 src/engine 一致"

      - name: Check config sync (src ↔ functions)
        run: bash scripts/check-config-sync.sh

      - name: Syntax check
        run: bash scripts/syntax-check.sh

      - name: RTP Gate (math regression)
        run: npm run test:rtp

      - name: Unit tests (password / csrf / headers / cbor / webauthn)
        run: |
          node tests/password-policy.test.js
          node tests/csrf-middleware.test.js
          node tests/response-headers.test.js
          node tests/cbor.test.js
          node tests/webauthn.test.js
          node tests/password-length.test.js

      - name: Engine tests
        run: |
          node tests/engine/all.test.cjs

      - name: E2E tests (SQL + API)
        run: |
          node tests/e2e/spin-sql.cjs
          node tests/e2e/spin-api.cjs

      - name: Fault injection (D-2)
        run: |
          node tests/fault/d1-fault.cjs
          node tests/fault/rate-limit-fault.cjs
          node tests/fault/concurrency-fault.cjs
          node tests/fault/config-fault.cjs

      - name: Monitoring probes + metrics (D-3)
        run: |
          node tests/monitoring/probes.cjs
          node tests/monitoring/metrics.cjs
          node tests/monitoring/error-reporter.cjs
          node tests/monitoring/reconnection.cjs

      - name: Rollout bucketing (D-4)
        run: |
          node tests/rollout/rollout.cjs

      - name: Settlement tests
        run: |
          node tests/settlement/guard-10.cjs
          node tests/settlement/a2-runtime-isolation.cjs
          node tests/settlement/a4-idempotency.cjs
          node tests/settlement/a5-fs-concurrency.cjs
          node tests/settlement/a6-reward-chain.cjs
          node tests/settlement/a7-ledger-recon.cjs
          node tests/settlement/a8-backup-restore.cjs
          node tests/settlement/a9-session-limit.cjs

      - name: Settlement cap guard (A-6b)
        run: |
          node tests/settlement/a6b-cap-guard.cjs

      - name: Security Scan
        run: node tests/security-scan.js

      - name: API Smoke Test
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "[SKIP] DEPLOY_BASE_URL 未配置，跳过 API 冒烟测试"
            exit 0
          fi
          node tests/api-smoke.test.js
