name: CI - Test & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：只有读代码的权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        # 不再回退到 npm install：
        #   npm ci 失败 = lockfile 与 package.json 不一致，
        #   必须修 lockfile，不能绕过可复现性
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: bash scripts/syntax-check.sh

      - name: Unit tests (password / csrf / headers / cbor / webauthn)
        run: |
          node tests/password-policy.test.js
          node tests/csrf-middleware.test.js
          node tests/response-headers.test.js
          node tests/cbor.test.js
          node tests/webauthn.test.js
          node tests/password-length.test.js

      - name: Security Scan
        run: node tests/security-scan.js

      - name: API Smoke Test
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "[SKIP] DEPLOY_BASE_URL 未配置，跳过 API 冒烟测试"
            exit 0
          fi
          node tests/api-smoke.test.js
