name: CI - Test & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Basic Syntax Check
        run: bash scripts/syntax-check.sh || echo "Syntax script missing, skipping."
        
      - name: Security Scan
        run: node tests/security-scan.js || echo "Security scan missing, skipping."
