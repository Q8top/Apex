<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TTS 试听 · Oh Zeus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #0a0612; color: #fff;
    min-height: 100vh; padding: 20px 16px 60px;
  }
  h1 { font-size: 20px; text-align: center; margin-bottom: 8px; color: #f0c952; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 12px; color: #999; margin-bottom: 22px; line-height: 1.6; }
  .tip {
    background: rgba(240,195,62,.1); border: 1px solid rgba(240,195,62,.3);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 20px;
    font-size: 12.5px; line-height: 1.7; color: #e0d5a8;
  }
  .tip b { color: #f0c952; }
  .grid { display: grid; gap: 10px; }
  .btn {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 3px; width: 100%; padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    border-radius: 14px; color: #fff; font-family: inherit;
    text-align: left; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:active { background: rgba(240,195,62,.15); border-color: rgba(240,195,62,.5); }
  .btn.playing { background: rgba(240,195,62,.2); border-color: #f0c952; }
  .btn-label { font-size: 14px; font-weight: 700; }
  .btn-desc { font-size: 11px; color: #999; }
  .btn.playing .btn-label { color: #f0c952; }
  .footer { text-align: center; font-size: 11px; color: #666; margin-top: 30px; }
</style>
</head>
<body>
<h1>Oh Zeus! 试听</h1>
<div class="sub">点击按钮试听不同语音风格<br>选一个最像的，然后用手机录屏保存</div>

<div class="tip">
  <b>如何保存为音频：</b><br>
  1. 点击按钮试听，选定满意的语音<br>
  2. 打开手机<b>录屏功能</b>（含麦克风）<br>
  3. 重新点击该按钮 → 录到 "Oh Zeus!"<br>
  4. 停止录屏，用手机剪辑 App（如剪映/美图）提取音频<br>
  5. 导出为 mp3/m4a
</div>

<div class="grid" id="grid"></div>

<div class="footer">Web Speech API · 效果受手机 TTS 引擎影响</div>

<script>
(function(){
  if (!('speechSynthesis' in window)) {
    document.getElementById('grid').innerHTML =
      '<div style="color:#e5484d;padding:20px;text-align:center;">当前浏览器不支持语音合成</div>';
    return;
  }

  var voices = [];
  function loadVoices() {
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;

  var CONFIGS = [
    { label: '低沉男声 · 慢速',  pitch: 0.4, rate: 0.75, vol: 1 },
    { label: '低沉男声 · 正常',  pitch: 0.4, rate: 0.95, vol: 1 },
    { label: '中性男声 · 中速',  pitch: 0.7, rate: 0.9,  vol: 1 },
    { label: '中性男声 · 快速',  pitch: 0.7, rate: 1.1,  vol: 1 },
    { label: '高亢男声 · 慢速',  pitch: 1.0, rate: 0.8,  vol: 1 },
    { label: '高亢男声 · 正常',  pitch: 1.0, rate: 1.0,  vol: 1 },
    { label: '女声 · 慢速',      pitch: 1.3, rate: 0.8,  vol: 1 },
    { label: '女声 · 正常',      pitch: 1.3, rate: 1.0,  vol: 1 },
    { label: '男声 + 拖尾',      pitch: 0.5, rate: 0.6,  vol: 1 },
    { label: '女声 · 高亢拖尾',  pitch: 1.5, rate: 0.7,  vol: 1 }
  ];

  var grid = document.getElementById('grid');
  var playingBtn = null;

  CONFIGS.forEach(function(cfg, idx){
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = '<span class="btn-label">' + cfg.label + '</span>' +
                    '<span class="btn-desc">音调 ' + cfg.pitch + ' · 语速 ' + cfg.rate + '</span>';
    btn.addEventListener('click', function(){ speak(cfg, btn); });
    grid.appendChild(btn);
  });

  function speak(cfg, btn) {
    window.speechSynthesis.cancel();
    // 清空上一个的高亮
    document.querySelectorAll('.btn.playing').forEach(function(b){ b.classList.remove('playing'); });

    var u = new SpeechSynthesisUtterance('Oh Zeus');
    u.lang = 'en-US';
    u.pitch = cfg.pitch;
    u.rate = cfg.rate;
    u.volume = cfg.vol;
    // 优先选英文男声
    var enVoices = voices.filter(function(v){ return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoices.length > 0) u.voice = enVoices[0];

    u.onstart = function(){ btn.classList.add('playing'); };
    u.onend = function(){ btn.classList.remove('playing'); };
    u.onerror = function(){ btn.classList.remove('playing'); };

    window.speechSynthesis.speak(u);
  }
})();
</script>
</body>
</html>
