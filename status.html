<link rel="stylesheet" href="/src/css/status.css">
  <style>html,body,*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}</style>
<style>.apex-loader{position:fixed;inset:0;z-index:9999;background:#fafafa;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}.apex-loader.apex-hide{opacity:0;pointer-events:none}.apex-loader-spin{width:36px;height:36px;border:3px solid #ececee;border-top-color:#0a0a0a;border-radius:50%;animation:apexSpin .8s linear infinite}@keyframes apexSpin{to{transform:rotate(360deg)}}</style>
<link rel="stylesheet" href="/src/css/apex-skeleton.css">
</head>
<body>
<div class="apex-loader" id="apex-loader"><div class="apex-loader-spin"></div></div>
<div class="container">

  <div class="header">
    <h1>APEX 系统状态</h1>
    <p>实时可用性监控</p>
  </div>

  <div class="overall">
    <div class="dot loading" id="overall-dot"></div>
    <div class="overall-text">
      <div class="title" id="overall-title">检查中...</div>
      <div class="meta" id="overall-meta">正在获取系统状态</div>
    </div>
  </div>

  <div class="service">
    <div>
      <div class="name">网站前端</div>
      <div class="desc">静态资源分发</div>
    </div>
    <div class="status loading" id="status-website">检查中</div>
  </div>

  <div class="service">
    <div>
      <div class="name">后端接口</div>
      <div class="desc">边缘计算 · API 网关</div>
    </div>
    <div class="status loading" id="status-api">检查中</div>
  </div>

  <div class="service">
    <div>
      <div class="name">数据库</div>
      <div class="desc">分布式数据存储</div>
    </div>
    <div class="status loading" id="status-db">检查中</div>
  </div>

  <div class="service">
    <div>
      <div class="name">邮件服务</div>
      <div class="desc" id="email-provider-desc">验证邮件投递</div>
    </div>
    <div class="status loading" id="status-email">检查中</div>
  </div>

  <div class="refresh">
    <button id="btn-refresh">刷新状态</button>
  </div>

  <div class="footer">
    <a href="/">← 返回首页</a> &nbsp;·&nbsp; © 2026 Apex Global Entertainment
  </div>

</div>

<script src="/src/js/inline/status-01.js"></script>
<script src="/src/js/inline/apex-loader.js"></script>
</body>
</html>
